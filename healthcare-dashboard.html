  //PREDICT
  function Predict({showToast}) {
    const [vals,setVals] = useState({
      patient_name:"",
      age:55, time_in_hospital:3, num_lab_procedures:40, num_procedures:1,
      num_medications:15, number_outpatient:0, number_emergency:0,
      number_inpatient:0, number_diagnoses:7,
      patient_encounter_count:1,
      insulin:"No", change:"No", diabetesMed:"Yes",
      // New clinical fields (replacing race/gender/a1c/glucose)
      admission_type_id:1,
      discharge_disposition_id:1,
      diag_1_group:7,   // primary diagnosis — default Circulatory
      diag_2_group:0,
      diag_3_group:0,
      specialty:"Cardiology",
      high_risk_specialty:0,
      // Defaults (not shown in form but sent to backend)
      race:"Caucasian", gender:"Female",
      a1c_result:"None", glucose_serum:"None",
      notes:""
    });
    const [result,setResult] = useState(null);
    const [loading,setLoading] = useState(false);

    const setNum = k=>e=>setVals(v=>({...v,[k]:Number(e.target.value)}));
    const setSel = k=>e=>setVals(v=>({...v,[k]:e.target.value}));
    const setStr = k=>e=>setVals(v=>({...v,[k]:e.target.value}));
    const setSelNum = k=>e=>setVals(v=>({...v,[k]:Number(e.target.value)}));

    // Auto-compute high_risk_specialty when specialty changes
    const setSpecialty = e=>{
      const sp = e.target.value;
      setVals(v=>({...v, specialty:sp, high_risk_specialty: HIGH_RISK_SPECIALTIES.includes(sp)?1:0}));
    };

    const sliders = [
      {key:"age",                    label:"Patient Age",             min:5,  max:95, step:5, unit:"yrs"},
      {key:"time_in_hospital",       label:"Days in Hospital",        min:1,  max:14, step:1, unit:"days"},
      {key:"num_lab_procedures",     label:"Lab Procedures",          min:1,  max:132,step:1, unit:"tests"},
      {key:"num_procedures",         label:"Procedures Performed",    min:0,  max:6,  step:1, unit:"procs"},
      {key:"num_medications",        label:"Num Medications",         min:1,  max:81, step:1, unit:"meds"},
      {key:"number_outpatient",      label:"Prior Outpatient Visits", min:0,  max:42, step:1, unit:"visits"},
      {key:"number_emergency",       label:"Prior ER Visits ★",       min:0,  max:20, step:1, unit:"visits"},
      {key:"number_inpatient",       label:"Prior Inpatient Visits ★",min:0,  max:21, step:1, unit:"visits"},
      {key:"number_diagnoses",       label:"Number of Diagnoses",     min:1,  max:16, step:1, unit:"diags"},
      {key:"patient_encounter_count",label:"Total Hospital Encounters ★",min:1,max:15,step:1,unit:"enc"},
    ];

    const submit = async()=>{
      if(!vals.patient_name.trim()){showToast("Please enter patient name","error");return;}
      setLoading(true);
      try{
        const data = await api("/predict",{method:"POST",body:JSON.stringify(vals)});
        if(data.prediction){
          setResult(data);
          showToast(`${vals.patient_name}: ${data.prediction}`,data.prediction==="High Risk"?"error":"success");
        } else { showToast(data.error||"Prediction failed","error"); }
      } catch(e){ showToast("Server error: "+e.message,"error"); }
      setLoading(false);
    };

    const isHigh = result?.prediction==="High Risk";
    const riskFlags = [];
    if(vals.patient_encounter_count>=3) riskFlags.push(`${vals.patient_encounter_count} total hospital encounters (chronic)`);
    if(vals.number_inpatient>=2)  riskFlags.push(`${vals.number_inpatient} prior inpatient stays`);
    if(vals.number_emergency>=2)  riskFlags.push(`${vals.number_emergency} prior ER visits`);
    if(vals.number_diagnoses>=9)  riskFlags.push(`${vals.number_diagnoses} diagnoses (high complexity)`);
    if(vals.num_medications>=20)  riskFlags.push(`${vals.num_medications} medications`);
    if(vals.high_risk_specialty)  riskFlags.push(`High-risk specialty: ${vals.specialty}`);
    if(vals.diag_1_group===7)     riskFlags.push("Primary Dx: Circulatory disease");
    if(vals.age>=75) riskFlags.push(`Age ${vals.age} — elderly patient`);

    const recommendations = isHigh
      ?["Schedule follow-up within 7 days of discharge","Review and reconcile all medications","Coordinate with case management / social services","Arrange home health or extended monitoring","Consider patient education on diabetes self-management"]
      :["Standard 30-day post-discharge follow-up","Routine medication review at next visit","Provide patient education materials","Ensure patient understands discharge instructions"];

    const selStyle = {width:"100%",padding:"7px 9px",background:"var(--surface2)",border:"1.5px solid var(--border)",borderRadius:8,color:"var(--text)",fontFamily:"inherit",fontSize:"0.83rem",outline:"none",cursor:"pointer"};
    const labelStyle = {fontSize:"0.72rem",fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:5};

    // -- PDF Report Generator --──────────────────────────────────────────────
    const DIAG_LABELS = ["","Circulatory / Heart","Respiratory","Digestive","Diabetes","Injury / Poisoning","Musculoskeletal","Genitourinary","Neoplasms","Mental Disorders","Neurological","Infectious Disease","Blood / Immune","Endocrine","Skin / Subcutaneous","Congenital","Perinatal","Symptoms / Ill-defined","Other","Unknown / Missing"];
    const ADMIT_LABELS = {1:"Emergency",2:"Urgent",3:"Elective",4:"Newborn",5:"Trauma"};
    const DISCH_LABELS = {1:"Discharged to Home",2:"Short-term Hospital",3:"SNF",4:"ICF",5:"Another Inpatient",6:"Home Health Care",7:"Left AMA",11:"Expired",13:"Hospice Home",14:"Hospice Medical",18:"Unknown",25:"Not Mapped",30:"Not Mapped"};

    const generatePDF = () => {
      if (!result) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
      const W = 210; const H = 297;
      const margin = 18;
      const col = margin;
      let y = 0;

      // safe: strip any non-latin1 chars so helvetica never garbles
      const safe = str => String(str||"").replace(/[^\x00-\xFF]/g,"").trim() || "-";
      // truncate with plain ascii ellipsis
      const trunc = (str, n) => { const s=safe(str); return s.length>n ? s.slice(0,n-2)+".." : s; };

      const accent  = [2,132,199];
      const danger  = [220,38,38];
      const success = [5,150,105];
      const purple  = [124,58,237];
      const muted   = [100,116,139];
      const dark    = [30,41,59];
      const highlight = isHigh ? danger : success;

      // -- HEADER BANNER --
      doc.setFillColor(...accent);
      doc.rect(0, 0, W, 28, "F");
      doc.setFillColor(0,80,120);
      doc.rect(0, 24, W, 4, "F");

      doc.setFont("helvetica","bold");
      doc.setFontSize(15);
      doc.setTextColor(255,255,255);
      doc.text("HR-Prediction-AI", margin, 11);
      doc.setFontSize(8.5);
      doc.setFont("helvetica","normal");
      doc.text("Healthcare Readmission Risk Assessment Report", margin, 17);
      doc.text("XGBoost + LightGBM Ensemble Model  |  v3.2", margin, 22);

      const now = new Date();
      const dateStr = now.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
      const timeStr = now.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
      doc.setFontSize(7.5);
      doc.setTextColor(200,230,255);
      doc.text("Generated: "+dateStr+"  "+timeStr, W-margin, 11, {align:"right"});
      doc.text("Clinical Decision Support Tool - Not a substitute for clinical judgment", W-margin, 17, {align:"right"});

      y = 36;

      // -- PATIENT IDENTITY BLOCK --
      doc.setFillColor(240,249,255);
      doc.roundedRect(margin, y, W-margin*2, 22, 3, 3, "F");
      doc.setDrawColor(...accent);
      doc.setLineWidth(0.5);
      doc.roundedRect(margin, y, W-margin*2, 22, 3, 3, "S");

      doc.setFont("helvetica","bold");
      doc.setFontSize(13);
      doc.setTextColor(...dark);
      doc.text(safe(vals.patient_name) || "Unknown", margin+4, y+8);

      doc.setFontSize(8);
      doc.setFont("helvetica","normal");
      doc.setTextColor(...muted);
      if (result.patient_id) {
        doc.setFont("helvetica","bold");
        doc.setTextColor(...accent);
        doc.text("Patient ID: "+safe(result.patient_id), margin+4, y+14);
        doc.setFont("helvetica","normal");
        doc.setTextColor(...muted);
      }
      doc.text("Age: "+vals.age+" yrs  |  Days in Hospital: "+vals.time_in_hospital+"  |  Specialty: "+safe(vals.specialty), margin+4, y+19);

      // Risk badge
      doc.setFillColor(...highlight);
      doc.roundedRect(W-margin-38, y+3, 34, 16, 3, 3, "F");
      doc.setFont("helvetica","bold");
      doc.setFontSize(10);
      doc.setTextColor(255,255,255);
      doc.text(safe(result.prediction), W-margin-21, y+11.5, {align:"center"});
      doc.setFontSize(8);
      doc.text(result.probability+"% Risk", W-margin-21, y+17, {align:"center"});

      y += 28;

      // -- RISK SCORE BAR --
      doc.setFont("helvetica","bold");
      doc.setFontSize(8.5);
      doc.setTextColor(...dark);
      doc.text("READMISSION RISK SCORE", col, y+4);

      // prob label left
      doc.setFontSize(8.5);
      doc.setTextColor(...highlight);
      doc.text(result.probability+"%  Readmission Risk", col, y+4);
      // no-readmission right
      doc.setTextColor(...muted);
      doc.setFont("helvetica","normal");
      doc.setFontSize(8.5);
      doc.text((100-result.probability).toFixed(1)+"%  No Readmission", W-margin, y+4, {align:"right"});

      const barX = col; const barY = y+8; const barW = W-margin*2; const barH = 7;
      doc.setFillColor(5,150,105);  doc.rect(barX,            barY, barW*0.4, barH, "F");
      doc.setFillColor(251,191,36); doc.rect(barX+barW*0.4,   barY, barW*0.2, barH, "F");
      doc.setFillColor(220,38,38);  doc.rect(barX+barW*0.6,   barY, barW*0.4, barH, "F");
      const markerX = barX + Math.min(0.95,Math.max(0.05,result.probability/100)) * barW;
      doc.setFillColor(255,255,255);
      doc.circle(markerX, barY+barH/2, 3.5, "F");
      doc.setDrawColor(...highlight);
      doc.setLineWidth(1);
      doc.circle(markerX, barY+barH/2, 3.5, "S");

      doc.setFontSize(7);
      doc.setTextColor(...muted);
      doc.text("Low", barX, barY+barH+4);
      doc.text("50%", barX+barW/2, barY+barH+4, {align:"center"});
      doc.text("High", barX+barW, barY+barH+4, {align:"right"});

      y += 26;

      // -- TWO COLUMN LAYOUT --
      const colW = (W - margin*2 - 6) / 2;
      const col2 = col + colW + 6;

      // LEFT: Clinical Parameters
      doc.setFillColor(248,250,252);
      doc.roundedRect(col, y, colW, 82, 3, 3, "F");
      doc.setDrawColor(210,220,230);
      doc.setLineWidth(0.3);
      doc.roundedRect(col, y, colW, 82, 3, 3, "S");
      doc.setFillColor(...accent);
      doc.roundedRect(col, y, colW, 7, 3, 3, "F");
      doc.rect(col, y+3.5, colW, 3.5, "F");
      doc.setFont("helvetica","bold");
      doc.setFontSize(7.5);
      doc.setTextColor(255,255,255);
      doc.text("CLINICAL PARAMETERS", col+4, y+5);

      const params = [
        ["Lab Procedures",        vals.num_lab_procedures+" tests"],
        ["Procedures Performed",  ""+vals.num_procedures],
        ["Num Medications",       ""+vals.num_medications],
        ["Prior Outpatient",      vals.number_outpatient+" visits"],
        ["Prior ER Visits [*]",   vals.number_emergency+" visits"],
        ["Prior Inpatient [*]",   vals.number_inpatient+" visits"],
        ["Num Diagnoses",         ""+vals.number_diagnoses],
        ["Total Encounters [*]",  ""+vals.patient_encounter_count],
      ];
      let py = y + 12;
      params.forEach(([lbl, val], i) => {
        if (i%2===0) { doc.setFillColor(252,254,255); doc.rect(col+1, py-3, colW-2, 8, "F"); }
        doc.setFont("helvetica","normal"); doc.setFontSize(7.2); doc.setTextColor(...muted);
        doc.text(lbl, col+4, py+2);
        doc.setFont("helvetica","bold"); doc.setTextColor(...dark);
        doc.text(safe(val), col+colW-4, py+2, {align:"right"});
        py += 8.5;
      });

      // RIGHT: Admission & Diagnosis Details
      doc.setFillColor(248,250,252);
      doc.roundedRect(col2, y, colW, 82, 3, 3, "F");
      doc.setDrawColor(210,220,230);
      doc.setLineWidth(0.3);
      doc.roundedRect(col2, y, colW, 82, 3, 3, "S");
      doc.setFillColor(...purple);
      doc.roundedRect(col2, y, colW, 7, 3, 3, "F");
      doc.rect(col2, y+3.5, colW, 3.5, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(255,255,255);
      doc.text("ADMISSION & DIAGNOSIS", col2+4, y+5);

      const admitLabel = ADMIT_LABELS[vals.admission_type_id] || ("Type "+vals.admission_type_id);
      const dischLabel = DISCH_LABELS[vals.discharge_disposition_id] || ("Disp "+vals.discharge_disposition_id);
      const diag1 = DIAG_LABELS[vals.diag_1_group] || "Unknown";
      const diag2 = vals.diag_2_group ? (DIAG_LABELS[vals.diag_2_group]||"Unknown") : "None";
      const diag3 = vals.diag_3_group ? (DIAG_LABELS[vals.diag_3_group]||"Unknown") : "None";

      const admDetails = [
        ["Admission Type",    admitLabel],
        ["Discharge Disp.",   dischLabel],
        ["Medical Specialty", vals.specialty],
        ["Primary Dx [*]",    diag1],
        ["Secondary Dx",      diag2],
        ["Tertiary Dx",       diag3],
        ["Insulin Use",       vals.insulin],
        ["Diabetes Med",      vals.diabetesMed],
      ];
      let ay = y + 12;
      admDetails.forEach(([lbl, val], i) => {
        if (i%2===0) { doc.setFillColor(252,254,255); doc.rect(col2+1, ay-3, colW-2, 8, "F"); }
        doc.setFont("helvetica","normal"); doc.setFontSize(7.2); doc.setTextColor(...muted);
        doc.text(lbl, col2+4, ay+2);
        doc.setFont("helvetica","bold"); doc.setTextColor(...dark);
        doc.text(trunc(val, 22), col2+colW-4, ay+2, {align:"right"});
        ay += 8.5;
      });

      y += 88;

      // -- RISK FACTORS --
      if (riskFlags.length > 0) {
        const rfH = 9 + riskFlags.length*7;
        doc.setFillColor(254,242,242);
        doc.roundedRect(col, y, W-margin*2, rfH, 3, 3, "F");
        doc.setDrawColor(220,38,38); doc.setLineWidth(0.4);
        doc.roundedRect(col, y, W-margin*2, rfH, 3, 3, "S");
        // left accent bar
        doc.setFillColor(...danger);
        doc.rect(col, y, 3, rfH, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...danger);
        doc.text("! RISK FACTORS IDENTIFIED", col+7, y+6);
        riskFlags.forEach((flag, i) => {
          doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(153,27,27);
          doc.text("- "+safe(flag), col+9, y+13+i*7);
        });
        y += rfH;
      }

      y += 5;

      // -- CLINICAL RECOMMENDATIONS --
      const recH = 9 + recommendations.length*7;
      doc.setFillColor(240,253,244);
      doc.roundedRect(col, y, W-margin*2, recH, 3, 3, "F");
      doc.setDrawColor(5,150,105); doc.setLineWidth(0.4);
      doc.roundedRect(col, y, W-margin*2, recH, 3, 3, "S");
      doc.setFillColor(...success);
      doc.rect(col, y, 3, recH, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(...success);
      doc.text("CLINICAL RECOMMENDATIONS", col+7, y+6);
      recommendations.forEach((rec, i) => {
        doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(6,78,59);
        doc.text("- "+safe(rec), col+9, y+13+i*7);
      });
      y += recH + 5;

      // -- CLINICAL NOTES --
      if (vals.notes && vals.notes.trim()) {
        const safeNote = safe(vals.notes);
        const noteLines = doc.splitTextToSize(safeNote, W-margin*2-10);
        const noteH = 9 + noteLines.length*6;
        doc.setFillColor(255,251,235);
        doc.roundedRect(col, y, W-margin*2, noteH, 3, 3, "F");
        doc.setDrawColor(217,119,6); doc.setLineWidth(0.3);
        doc.roundedRect(col, y, W-margin*2, noteH, 3, 3, "S");
        doc.setFillColor(217,119,6); doc.rect(col, y, 3, noteH, "F");
        doc.setFont("helvetica","bold"); doc.setFontSize(7.5); doc.setTextColor(146,64,14);
        doc.text("CLINICAL NOTES", col+7, y+6);
        doc.setFont("helvetica","normal"); doc.setFontSize(7.2); doc.setTextColor(120,53,15);
        doc.text(noteLines, col+9, y+12);
        y += noteH + 4;
      }

      y += 2;

      // -- DISCLAIMER --
      doc.setFillColor(241,245,249);
      doc.roundedRect(col, y, W-margin*2, 16, 2, 2, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(7); doc.setTextColor(...muted);
      doc.text("DISCLAIMER:", col+4, y+5.5);
      doc.setFont("helvetica","normal");
      doc.text("This report is generated by an AI decision support tool (XGBoost + LightGBM ensemble).", col+24, y+5.5);
      doc.text("It is intended to assist clinical decision-making and must not replace judgment of a qualified clinician.", col+4, y+11);

      // -- FOOTER --
      doc.setFillColor(...accent);
      doc.rect(0, H-12, W, 12, "F");
      doc.setFont("helvetica","normal"); doc.setFontSize(7);
      doc.setTextColor(200,230,255);
      doc.text("HR-Prediction-AI  |  Clinical Decision Support  |  Confidential Medical Document", margin, H-5);
      doc.setTextColor(255,255,255);
      doc.text("Page 1  |  "+dateStr, W-margin, H-5, {align:"right"});

      // -- SAVE --
      const filename = "HR_Risk_Report_"+safe(vals.patient_name).replace(/\s+/g,"_")+"_"+(result.patient_id||"unknown")+".pdf";
      doc.save(filename);
      showToast("PDF report downloaded!", "success");
    };
    // --──────────────────────────────────────────────────────────────────────

    return (
      <div className="page">
        <div className="predict-layout">
          <div className="card">
            <div className="card-title">🔬 Patient Risk Assessment</div>
            <div className="card-sub">Complete clinical parameters — items marked ★ have the highest predictive impact</div>

            {/* Patient name + notes */}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:18}}>
              <div>
                <div style={labelStyle}>Patient Name <span style={{color:"var(--danger)"}}>*</span></div>
                <input value={vals.patient_name} onChange={setStr("patient_name")}
                  placeholder="e.g. Rajesh Kumar"
                  style={{width:"100%",padding:"9px 12px",background:"var(--surface2)",border:"1.5px solid var(--border)",borderRadius:8,color:"var(--text)",fontFamily:"inherit",fontSize:"0.9rem",outline:"none"}}
                  onFocus={e=>e.target.style.borderColor="var(--accent)"}
                  onBlur={e=>e.target.style.borderColor="var(--border)"}/>
              </div>
              <div>
                <div style={labelStyle}>Clinical Notes</div>
                <input value={vals.notes} onChange={setStr("notes")}
                  placeholder="Optional clinical notes…"
                  style={{width:"100%",padding:"9px 12px",background:"var(--surface2)",border:"1.5px solid var(--border)",borderRadius:8,color:"var(--text)",fontFamily:"inherit",fontSize:"0.9rem",outline:"none"}}
                  onFocus={e=>e.target.style.borderColor="var(--accent)"}
                  onBlur={e=>e.target.style.borderColor="var(--border)"}/>
              </div>
            </div>

            {/* Sliders */}
            <div className="form-grid">
              {sliders.map(s=>(
                <div key={s.key} className="slider-group">
                  <div className="slider-header">
                    <span className="slider-label">{s.label}</span>
                    <span className="slider-val">{vals[s.key]} <span style={{fontSize:"0.68rem",color:"var(--text-muted)",fontFamily:"inherit"}}>{s.unit}</span></span>
                  </div>
                  <input type="range" min={s.min} max={s.max} step={s.step} value={vals[s.key]} onChange={setNum(s.key)}/>
                </div>
              ))}
            </div>

            {/* Clinical dropdowns — 4 removed (race/gender/a1c/glucose), replaced with clinical ones */}
            <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"14px 16px",marginBottom:16}}>
              <div style={{fontSize:"0.72rem",fontWeight:700,color:"var(--accent)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:12}}>🏥 Admission & Diagnosis Details</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:10}}>
                <div>
                  <div style={labelStyle}>Admission Type</div>
                  <select value={vals.admission_type_id} onChange={setSelNum("admission_type_id")} style={selStyle}>
                    {ADMISSION_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Discharge Disposition</div>
                  <select value={vals.discharge_disposition_id} onChange={setSelNum("discharge_disposition_id")} style={selStyle}>
                    {DISCHARGE_OPTS.map(o=><option key={o.val} value={o.val}>{o.label}</option>)}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Medical Specialty</div>
                  <select value={vals.specialty} onChange={setSpecialty} style={selStyle}>
                    {SPECIALTIES_LIST.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                  {vals.high_risk_specialty===1&&<div style={{fontSize:"0.68rem",color:"var(--danger)",marginTop:3}}>⚠ High-readmission specialty</div>}
                </div>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                <div>
                  <div style={labelStyle}>Primary Diagnosis (Diag 1) ★</div>
                  <select value={vals.diag_1_group} onChange={setSelNum("diag_1_group")} style={selStyle}>
                    {DIAG_GROUPS.map(g=><option key={g.val} value={g.val}>{g.label}</option>)}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Secondary Diagnosis (Diag 2)</div>
                  <select value={vals.diag_2_group} onChange={setSelNum("diag_2_group")} style={selStyle}>
                    {DIAG_GROUPS.map(g=><option key={g.val} value={g.val}>{g.label}</option>)}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Tertiary Diagnosis (Diag 3)</div>
                  <select value={vals.diag_3_group} onChange={setSelNum("diag_3_group")} style={selStyle}>
                    {DIAG_GROUPS.map(g=><option key={g.val} value={g.val}>{g.label}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Medication row */}
            <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,padding:"14px 16px",marginBottom:16}}>
              <div style={{fontSize:"0.72rem",fontWeight:700,color:"var(--accent)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:12}}>💊 Medication Status</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
                <div>
                  <div style={labelStyle}>Insulin Use</div>
                  <select value={vals.insulin} onChange={setSel("insulin")} style={selStyle}>
                    {["No","Steady","Up","Down"].map(o=><option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>Medication Changed</div>
                  <select value={vals.change} onChange={setSel("change")} style={selStyle}>
                    <option value="No">No Change</option>
                    <option value="Ch">Changed</option>
                  </select>
                </div>
                <div>
                  <div style={labelStyle}>On Diabetes Medication</div>
                  <select value={vals.diabetesMed} onChange={setSel("diabetesMed")} style={selStyle}>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                  </select>
                </div>
              </div>
            </div>

            <button className="btn btn-primary" onClick={submit} disabled={loading} style={{width:"auto",padding:"11px 32px"}}>
              {loading?"Analyzing Patient…":"Run Prediction →"}
            </button>
          </div>

          <div className="result-panel">
            <div className={`result-ring ${result?(isHigh?"high":"low"):""}`}>
              {result?(isHigh?"⚠️":"✅"):"🔮"}
            </div>

            {result?(
              <>
                {result.patient_id&&(
                  <div className="result-patient-id">🪪 {result.patient_id}</div>
                )}
                <div className={`result-label ${isHigh?"high":"low"}`}>{result.prediction}</div>
                <div style={{fontSize:"0.82rem",color:"var(--text-muted)",marginBottom:4}}>{vals.patient_name}</div>
                {result.probability&&(
                  <div style={{marginBottom:10}}>
                    <ProbabilityChart prob={result.probability} isHigh={isHigh}/>
                    <div style={{display:"flex",justifyContent:"center",gap:20,marginTop:7}}>
                      <div className="prob-item"><div className="prob-num" style={{color:isHigh?"var(--danger)":"var(--success)"}}>{result.probability}%</div><div className="prob-key">Readmission Risk</div></div>
                      <div className="prob-item"><div className="prob-num" style={{color:"var(--text-dim)"}}>{(100-result.probability).toFixed(1)}%</div><div className="prob-key">No Readmission</div></div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.69rem",color:"var(--text-muted)",margin:"9px 0 3px"}}><span>Low</span><span>50%</span><span>High</span></div>
                    <div style={{height:6,borderRadius:99,background:"linear-gradient(90deg,var(--success),#fbbf24,var(--danger))",position:"relative"}}>
                      <div style={{position:"absolute",top:"50%",transform:"translate(-50%,-50%)",left:`${Math.min(95,Math.max(5,result.probability))}%`,width:12,height:12,borderRadius:"50%",background:"white",border:"2.5px solid "+(isHigh?"var(--danger)":"var(--success)"),boxShadow:"0 1px 4px rgba(0,0,0,0.2)",transition:"left 0.5s ease"}}/>
                    </div>
                  </div>
                )}
                <div className="recommend-box">
                  <h4>Clinical Recommendations</h4>
                  <ul>{recommendations.map((r,i)=><li key={i}>{r}</li>)}</ul>
                </div>
                {riskFlags.length>0&&(
                  <div className="recommend-box" style={{marginTop:10,borderColor:"rgba(220,38,38,0.25)",background:"var(--danger-light)"}}>
                    <h4 style={{color:"var(--danger)"}}>⚠ Risk Factors</h4>
                    <ul>{riskFlags.map((f,i)=><li key={i} style={{color:"#991b1b"}}>{f}</li>)}</ul>
                  </div>
                )}
                <button onClick={generatePDF}
                  style={{
                    marginTop:14,width:"100%",padding:"10px 0",
                    background:"linear-gradient(135deg,#0284c7,#0d9488)",
                    color:"white",border:"none",borderRadius:9,
                    fontFamily:"inherit",fontSize:"0.84rem",fontWeight:700,
                    cursor:"pointer",display:"flex",alignItems:"center",
                    justifyContent:"center",gap:7,
                    boxShadow:"0 3px 12px rgba(2,132,199,0.35)",
                    transition:"all 0.2s"
                  }}
                  onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-1px)";e.currentTarget.style.boxShadow="0 6px 18px rgba(2,132,199,0.45)";}}
                  onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="0 3px 12px rgba(2,132,199,0.35)";}}>
                  <span style={{fontSize:"1rem"}}>📄</span>
                  Generate PDF Report
                </button>
              </>
            ):(
              <div style={{color:"var(--text-muted)",fontSize:"0.88rem",marginTop:10}}>
                <div style={{fontSize:"1.8rem",marginBottom:10}}>🏥</div>

    followup_booked:{label:"Follow-up Booked",color:"#0284c7",bg:"#e0f2fe",border:"rgba(2,132,199,0.25)"},

  function FollowupBadge({status}) {
    const s = FOLLOWUP_LABELS[status] || FOLLOWUP_LABELS.pending;
    return <span style={{fontSize:"0.7rem",fontWeight:700,padding:"2px 8px",borderRadius:99,
      color:s.color,background:s.bg,border:`1px solid ${s.border}`,whiteSpace:"nowrap"}}>{s.label}</span>;
  }

  function ShapDrawer({shap_json,onClose}) {
    let items = [];
    try { items = JSON.parse(shap_json||"[]"); } catch {}
    if(!items.length) return null;
    const max = Math.max(...items.map(x=>Math.abs(x.value)),0.01);
    return (
      <div style={{position:"fixed",inset:0,zIndex:3000,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center"}}
        onClick={onClose}>
        <div style={{background:"var(--surface)",borderRadius:14,padding:24,minWidth:340,maxWidth:480,width:"90%",boxShadow:"0 12px 48px rgba(0,0,0,0.25)"}}
          onClick={e=>e.stopPropagation()}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div style={{fontWeight:700,fontSize:"0.92rem",color:"var(--text)"}}>🧠 Feature Contributions</div>
            <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:18,color:"var(--text-muted)"}}>✕</button>
          </div>
          <div style={{fontSize:"0.72rem",color:"var(--text-muted)",marginBottom:14}}>Which inputs drove this prediction the most</div>
          {items.map((it,i)=>(
            <div key={i} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.78rem",marginBottom:4}}>
                <span style={{color:"var(--text-dim)",fontWeight:500}}>{it.feature}</span>
                <span style={{fontFamily:"'JetBrains Mono',monospace",color:it.value>0?"var(--danger)":"var(--success)",fontSize:"0.75rem",fontWeight:600}}>{it.value>0?"+":""}{(it.value*100).toFixed(1)}%</span>
              </div>
              <div style={{height:7,borderRadius:99,background:"var(--bg2)",overflow:"hidden"}}>
                <div style={{height:"100%",borderRadius:99,width:`${Math.abs(it.value)/max*100}%`,
                  background:it.value>0?"linear-gradient(90deg,#f87171,#dc2626)":"linear-gradient(90deg,#34d399,#059669)",
                  transition:"width 0.5s ease"}}/>
              </div>
            </div>
          ))}
          <div style={{marginTop:14,fontSize:"0.7rem",color:"var(--text-muted)",textAlign:"center",fontStyle:"italic"}}>
            Red = increases risk · Green = decreases risk
          </div>
        </div>
      </div>
    );

  //METRICS
  function ModelMetrics({showToast}) {
    const [metrics,setMetrics] = useState(null);
    const rocRef = useRef(null);
    const impRef = useRef(null);

    useEffect(()=>{
      api(`/model-metrics?t=${Date.now()}`).then(d=>{ if(d&&!d.error) setMetrics(d); else showToast("Failed to load metrics","error"); }).catch(()=>showToast("Failed to load metrics","error"));
    },[]);

    const rocCfg = metrics?{
      type:"line",
      data:{
        labels:metrics.roc_curve.map(p=>p.fpr.toFixed(2)),
        datasets:[
          {label:`ROC Curve (AUC=${metrics.auc_roc})`,data:metrics.roc_curve.map(p=>p.tpr),
            borderColor:"#0284c7",backgroundColor:"rgba(2,132,199,0.07)",
            fill:true,tension:0.3,pointRadius:0,borderWidth:2},
          {label:"Random",data:metrics.roc_curve.map(p=>p.fpr),

            fill:false,pointRadius:0,borderWidth:1.5,tension:0}
        ]

      options:{

        plugins:{legend:{labels:{color:"#64748b",font:{size:10,family:"Inter"}}}},

             ticks:{color:"#94a3b8",font:{size:9}},grid:{color:"rgba(0,80,120,0.05)"}},

      {label:"Accuracy", val:metrics.accuracy},

      {label:"F1 Score", val:metrics.f1_score},
      {label:"AUC-ROC",  val:metrics.auc_roc},

      <div className="page">
        <div className="card" style={{marginBottom:16}}>

            {metrics.model_type||"XGBoost"} — UCI Diabetes Readmission Dataset
            {metrics.model_type&&metrics.model_type.includes("Fallback")&&(
              <span style={{marginLeft:8,padding:"2px 9px",background:"var(--warning-light)",border:"1px solid rgba(217,119,6,0.3)",borderRadius:99,fontSize:"0.72rem",color:"var(--warning)"}}>

        </div>
      </div>
    );

  //ALLPATIENTS (admin only)
  function AllPatients({showToast}) {
    const [rows,setRows]             = useState([]);
    const [loading,setLoading]       = useState(true);
    const [search,setSearch]         = useState("");
    const [filterResult,setFilterResult] = useState("");
    const [dateFrom,setDateFrom]     = useState("");
    const [dateTo,setDateTo]         = useState("");
    const [clinicianF,setClinicianF] = useState("");
    const [wardF,setWardF]           = useState("");
    const [fupRow,setFupRow]         = useState(null);
    const [fupStatus,setFupStatus]   = useState("pending");
    const [fupNote,setFupNote]       = useState("");
    const [shapRow,setShapRow]       = useState(null);

    const load = ()=>{
      setLoading(true);
      const params = new URLSearchParams();
      if(search)       params.set("search",search);
      if(filterResult) params.set("result",filterResult);
      if(dateFrom)     params.set("date_from",dateFrom);
      if(dateTo)       params.set("date_to",dateTo);
      if(clinicianF)   params.set("clinician",clinicianF);
      if(wardF)        params.set("ward",wardF);
      api(`/all-patients?${params.toString()}`)
        .then(d=>{setRows(d.patients||[]);setLoading(false);})
        .catch(()=>{showToast("Failed to load patients","error");setLoading(false);});
    };
    useEffect(()=>{load();},[]);

    const openFup=(row)=>{setFupRow(row);setFupStatus(row.followup_status||"pending");setFupNote(row.followup_note||"");};
    const saveFup=async()=>{
      if(!fupRow) return;
      try {
        await api(`/followup/${fupRow.id}`,{method:"PUT",body:JSON.stringify({status:fupStatus,note:fupNote})});
        showToast("Follow-up updated","success"); setFupRow(null); load();
      } catch { showToast("Failed to update","error"); }
    };

    // CSV export — uses \n escape (not literal newline) so Babel parses correctly
    const exportCSV = () => {
      const NL = "\n";
      const headers = ["Patient ID","Name","Age","Result","Probability","Clinician","Ward","Follow-up","Date"];
      const csvRows = rows.map(r => {
        const fupLabel = (FOLLOWUP_LABELS[r.followup_status] || {}).label || "Pending";
        const dateStr  = r.created_at ? r.created_at.split(" ")[0] : "";
        const cells    = [r.patient_id, r.patient_name, r.age, r.result,
                          r.probability, r.clinician, r.ward || "",
                          fupLabel, dateStr];
        return cells.map(v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",");
      });
      const csvContent = headers.join(",") + NL + csvRows.join(NL);
      const blob = new Blob([csvContent], {type: "text/csv;charset=utf-8;"});
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href     = url;
      a.download = "patients_export.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("CSV exported", "success");
    };

    return (
      <div className="page">
        {shapRow&&<ShapDrawer shap_json={shapRow.shap_json} onClose={()=>setShapRow(null)}/>}

        {fupRow&&(
          <div style={{position:"fixed",inset:0,zIndex:3000,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center"}}
            onClick={()=>setFupRow(null)}>
            <div style={{background:"var(--surface)",borderRadius:14,padding:24,minWidth:320,maxWidth:420,width:"90%"}} onClick={e=>e.stopPropagation()}>
              <div style={{fontWeight:700,fontSize:"0.95rem",marginBottom:4}}>📋 Update Follow-up</div>
              <div style={{fontSize:"0.8rem",color:"var(--text-muted)",marginBottom:16}}>{fupRow.patient_name} · {fupRow.patient_id}</div>
              <select value={fupStatus} onChange={e=>setFupStatus(e.target.value)}

  //USERS (admin only)
  function Users({showToast}) {
    const [users,setUsers] = useState([]);
    const [loading,setLoading] = useState(true);
    const [form,setForm] = useState({full_name:"",email:"",password:"",mobile:"",role:"user",degree:"",specialty:"",position:"",years_experience:"",hospital_name:"",hospital_city:"",department:"",medical_reg_no:""});
    const [adding,setAdding] = useState(false);
    const [confirmId,setConfirmId] = useState(null);
    const [editId,setEditId] = useState(null);
    const [editForm,setEditForm] = useState({});

    const load = ()=>{
      setLoading(true);
      api("/users").then(d=>{setUsers(d.users||[]);setLoading(false);})
        .catch(()=>{showToast("Failed to load users","error");setLoading(false);});
    };
    useEffect(()=>{load();},[]);

    const addUser = async()=>{
      if(!form.email||!form.password){showToast("Email and password are required","error");return;}
      setAdding(true);
      const d = await api("/admin/create-user",{method:"POST",body:JSON.stringify(form)}).catch(()=>null);
      if(d?.message==="User registered successfully"){
        showToast(`✅ Account created! Username: @${d.username||form.email.split("@")[0]}  — user can now login with their email.`,"success");
        setForm({full_name:"",email:"",password:"",mobile:"",role:"user",degree:"",specialty:"",position:"",years_experience:"",hospital_name:"",hospital_city:"",department:"",medical_reg_no:""});
        load();
      } else { showToast(d?.message||"Failed","error"); }
      setAdding(false);
    };

    const deleteUser = async(id)=>{
      if(confirmId!==id){setConfirmId(id);return;}
      setConfirmId(null);
      const d = await api(`/delete-user/${id}`,{method:"DELETE"}).catch(()=>null);
      if(d?.message==="User deleted successfully"){showToast("User deleted","success");load();}
      else showToast(d?.message||"Delete failed","error");
    };

    const saveEdit = async(id)=>{
      const payload={role:editForm.role,email:editForm.email};
      if(editForm.password) payload.password=editForm.password;
      const d = await api(`/update-user/${id}`,{method:"PUT",body:JSON.stringify(payload)}).catch(()=>null);
      if(d?.message==="User updated successfully"){showToast("Updated","success");setEditId(null);load();}
      else showToast(d?.message||"Update failed","error");
    };

    const set=k=>e=>setForm(f=>({...f,[k]:e.target.value}));
    const setEd=k=>e=>setEditForm(f=>({...f,[k]:e.target.value}));

    if(loading) return <div className="page"><div className="spinner"/></div>;

    return (
      <div className="page">
        <div className="card" style={{marginBottom:16,borderLeft:"3px solid var(--purple)"}}>
          <div className="card-title" style={{color:"var(--purple)"}}>➕ Add New Clinician — Admin Only</div>
          <div className="card-sub">User will login with email + password and complete their profile on first login</div>

          {/* Row 1: identity */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:10}}>
            {[["Full Name","full_name","text","Dr. First Last"],["Email *","email","email","doctor@hospital.com"],["Password *","password","password","Min 4 chars"],["Mobile","mobile","tel","+91 98765..."]].map(([lbl,k,type,ph])=>(
              <div key={k} className="field" style={{margin:0}}>
                <label>{lbl}</label>
                <input type={type} value={form[k]||""} onChange={set(k)} placeholder={ph}/>
              </div>
            ))}
          </div>

          {/* Row 2: professional */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr 1fr",gap:10,marginBottom:10}}>
            <div className="field" style={{margin:0}}>
              <label>Role</label>
              <select value={form.role||"user"} onChange={set("role")}>
                <option value="user">Clinician</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Degree</label>
              <select value={form.degree||""} onChange={set("degree")}>
                {["","MBBS","MD","MS","DO","DM","BDS","BSc Nursing","MSc Nursing","Other"].map(d=><option key={d} value={d}>{d||"Select…"}</option>)}
              </select>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Specialty</label>
              <select value={form.specialty||""} onChange={set("specialty")}>
                {["","General Medicine","Cardiology","Nephrology","Pulmonology","Endocrinology","Emergency Medicine","Pediatrics","Gynecology","Other"].map(s=><option key={s} value={s}>{s||"Select…"}</option>)}
              </select>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Position</label>
              <select value={form.position||""} onChange={set("position")}>
                {["","Resident Doctor","Junior Doctor","Consultant","Senior Consultant","HOD","Nurse Practitioner","Other"].map(p=><option key={p} value={p}>{p||"Select…"}</option>)}
              </select>
            </div>
            <div className="field" style={{margin:0}}>
              <label>Yrs Experience</label>
              <input type="number" min="0" max="60" value={form.years_experience||""} onChange={set("years_experience")} placeholder="e.g. 5"/>
            </div>
          </div>

          {/* Row 3: hospital */}
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:10,marginBottom:12}}>
            {[["Hospital Name","hospital_name","text","Apollo, AIIMS…"],["City","hospital_city","text","Mumbai"],["Department","department","text","ICU, OPD…"],["Reg. No.","medical_reg_no","text","MCI-12345"]].map(([lbl,k,type,ph])=>(
              <div key={k} className="field" style={{margin:0}}>
                <label>{lbl}</label>
                <input type={type} value={form[k]||""} onChange={set(k)} placeholder={ph}/>
              </div>
            ))}
          </div>

          <button className="btn btn-primary" onClick={addUser} disabled={adding} style={{width:"auto",padding:"10px 26px"}}>
            {adding?"Creating Account…":"➕ Create Clinician Account"}
          </button>
        </div>

        <div className="card">
          <div className="card-title" style={{color:"var(--purple)"}}>👥 All Users — Admin Only</div>
          <div className="card-sub">{users.length} registered accounts</div>
          <div className="table-wrap">
            <table>
              <thead><tr>
                <th>#</th><th>Clinician</th><th>Role</th>
                <th>Qualification</th><th>Hospital</th><th>Contact</th>
                <th>Reg. No.</th><th>Joined</th><th>Predictions</th><th>Actions</th>
              </tr></thead>
              <tbody>
                {users.map(u=>(
                  <tr key={u.id}>
                    <td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"0.73rem",color:"var(--text-muted)"}}>{u.id}</td>
                    <td style={{minWidth:150}}>
                      <div style={{fontWeight:700,color:"var(--text)",fontSize:"0.9rem"}}>{u.full_name||u.username}</div>
                      <div style={{fontSize:"0.72rem",color:"var(--text-muted)",marginTop:1}}>{u.email||"—"}</div>
                    </td>
                    <td>
                      {editId===u.id?(
                        <select value={editForm.role} onChange={setEd("role")} style={{padding:"3px 7px",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,fontFamily:"inherit",fontSize:"0.8rem"}}>
                          <option value="user">Clinician</option>
                          <option value="admin">Admin</option>
                        </select>
                      ):(
                        <span className={`badge ${u.role==="admin"?"badge-admin":"badge-user"}`}>
                          {u.role==="admin"?"Admin":"Clinician"}
                        </span>
                      )}
                    </td>
                    <td>
                      <div style={{fontSize:"0.83rem",fontWeight:700,color:"var(--accent)"}}>{u.degree||"—"}</div>
                      <div style={{fontSize:"0.74rem",color:"var(--text-dim)"}}>{u.specialty||"—"}</div>
                      <div style={{fontSize:"0.7rem",color:"var(--text-muted)"}}>{u.position||""}{u.years_experience?` · ${u.years_experience}yr`:""}</div>
                    </td>
                    <td>
                      <div style={{fontSize:"0.83rem",fontWeight:600}}>{u.hospital_name||"—"}</div>
                      <div style={{fontSize:"0.72rem",color:"var(--text-muted)"}}>{u.hospital_city||""}</div>
                    </td>
                    <td>
                      {editId===u.id?(
                        <span style={{display:"flex",flexDirection:"column",gap:4}}>
                          <input value={editForm.email||""} onChange={setEd("email")} placeholder="email"
                            style={{padding:"3px 7px",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,fontFamily:"inherit",fontSize:"0.78rem",width:140}}/>
                          <input type="password" value={editForm.password||""} onChange={setEd("password")} placeholder="new password"
                            style={{padding:"3px 7px",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:6,fontFamily:"inherit",fontSize:"0.78rem",width:140}}/>
                        </span>
                      ):(
                        <div>
                          <div style={{fontSize:"0.8rem"}}>{u.email||"—"}</div>
                          <div style={{fontSize:"0.74rem",color:"var(--text-muted)"}}>{u.mobile||"—"}</div>
                        </div>
                      )}
                    </td>
                    <td style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"0.78rem",color:"var(--text-dim)"}}>{u.medical_reg_no||"—"}</td>
                    <td style={{fontSize:"0.76rem",color:"var(--text-muted)",whiteSpace:"nowrap"}}>{u.created_at?(u.created_at.split("T")[0]||u.created_at.split(" ")[0]):"—"}</td>
                    <td style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:600,color:"var(--accent)"}}>{u.predictions||0}</td>
                    <td>
                      {editId===u.id?(
                        <span style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                          <button className="action-btn" style={{borderColor:"rgba(5,150,105,0.3)",color:"var(--success)"}} onClick={()=>saveEdit(u.id)}>Save</button>
                          <button className="action-btn" onClick={()=>setEditId(null)}>Cancel</button>
                        </span>
                      ):u.username!=="admin"?(
                        <span style={{display:"flex",gap:5}}>
                          <button className="action-btn" onClick={()=>{setEditId(u.id);setEditForm({role:u.role,email:u.email,password:""});}}>Edit</button>
                          {confirmId===u.id
                            ?<><button className="del-btn" onClick={()=>deleteUser(u.id)}>Confirm?</button>
                               <button className="action-btn" onClick={()=>setConfirmId(null)}>Cancel</button></>
                            :<button className="del-btn" onClick={()=>setConfirmId(u.id)}>Remove</button>}
                        </span>
                      ):<span style={{fontSize:"0.74rem",color:"var(--text-muted)"}}>Protected</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

        labels:stats.monthly_trend.map(t=>t.date),

  //ACTIVITYLOG (admin only)
  function ActivityLog({showToast}) {
    const [logs,setLogs] = useState([]);
    const [loading,setLoading] = useState(true);
    const [search,setSearch] = useState("");

    useEffect(()=>{
      api("/activity-log").then(d=>{setLogs(d.logs||[]);setLoading(false);})
        .catch(()=>{showToast("Failed to load logs","error");setLoading(false);});
    },[]);

    const filtered = logs.filter(l=>
      !search||l.username?.toLowerCase().includes(search.toLowerCase())||
      l.action?.toLowerCase().includes(search.toLowerCase())||
      l.details?.toLowerCase().includes(search.toLowerCase())
    );

    return (
      <div className="page">
        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div className="card-title" style={{color:"var(--purple)"}}>📋 Activity Log — Admin Only</div>
              <div className="card-sub" style={{marginBottom:0}}>All user actions — {filtered.length} of {logs.length} entries</div>
            </div>
            <input className="search-bar" value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Filter by user / action…" style={{width:220}}/>
          </div>
          {loading?<div className="spinner"/>:filtered.length===0?(
            <div className="empty-state"><div className="emoji">📭</div><p>No activity yet.</p></div>
          ):(
            <div style={{maxHeight:600,overflowY:"auto"}}>
              {filtered.map((log,i)=>(
                <div key={i} className="log-row">
                  <span className="log-time">{log.created_at?log.created_at.split(".")[0].replace("T"," "):""}</span>
                  <span className={`log-action ${log.action}`}>{log.action}</span>
                  <span style={{fontWeight:600,color:"var(--text)",minWidth:90}}>{log.username}</span>
                  <span className="log-details">{log.details||""}</span>

  //PROBCHART
  function ProbabilityChart({prob,isHigh}) {
    const ref=useRef(null); const inst=useRef(null);
    useEffect(()=>{
      if(!ref.current)return;
      if(inst.current){inst.current.destroy();inst.current=null;}
      const safe=Math.min(99.9,Math.max(0.1,prob||50));
      inst.current=new Chart(ref.current,{type:"doughnut",
        data:{labels:["Risk","Safe"],datasets:[{data:[safe,100-safe],
          backgroundColor:[isHigh?"rgba(220,38,38,0.85)":"rgba(5,150,105,0.85)","rgba(0,80,120,0.06)"],borderWidth:0,hoverOffset:4}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:"78%",plugins:{legend:{display:false}},animation:{animateRotate:true,duration:900}}
      });
      return()=>{if(inst.current){inst.current.destroy();inst.current=null;}};
    },[prob,isHigh]);
    return(<div style={{position:"relative",height:110,width:110,margin:"0 auto"}}>
      <canvas ref={ref}/>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",pointerEvents:"none"}}>
        <div style={{fontSize:"1.2rem",fontWeight:700,color:isHigh?"var(--danger)":"var(--success)",fontFamily:"'JetBrains Mono',monospace",lineHeight:1}}>{(prob||0).toFixed(0)}%</div>
        <div style={{fontSize:"0.58rem",color:"var(--text-muted)",fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px"}}>Risk</div>
      </div>
    </div>);
  }

  function BulkImport({showToast}) {
    const [file,setFile]         = React.useState(null);
    const [results,setResults]   = React.useState(null);
    const [loading,setLoading]   = React.useState(false);
    const [preview,setPreview]   = React.useState([]);
    const [parsedRows,setParsedRows] = React.useState([]);

    const parseCSV = (text) => {
      var NL = "\n";
      var allLines = text.trim().split(NL);
      var lines = allLines.filter(function(l){ return l.trim(); });
      if(lines.length < 2) return [];
      var headers = lines[0].split(",").map(function(h){
        return h.trim().replace(/"/g,"").toLowerCase().replace(/\s+/g,"_");
      });
      return lines.slice(1).map(function(line){
        var vals = line.split(",").map(function(v){ return v.trim().replace(/"/g,""); });
        var obj = {};
        headers.forEach(function(h,i){ obj[h] = vals[i] || ""; });
        return obj;
      });
    };

    const handleFile = (e) => {
      const f = e.target.files[0];
      if(!f) return;
      if(!f.name.endsWith(".csv")){ showToast("Please upload a .csv file","error"); return; }
      setFile(f);
      const reader = new FileReader();
      reader.onload = (ev) => {
        const rows = parseCSV(ev.target.result);
        setParsedRows(rows);
        setPreview(rows.slice(0,5));
      };
      reader.readAsText(f);
    };

    const runBulk = async () => {
      if(!parsedRows.length){ showToast("No data to import","error"); return; }
      setLoading(true); setResults(null);
      try {
        const data = await api("/bulk-predict",{method:"POST",body:JSON.stringify({rows:parsedRows})});
        setResults(data);
        showToast("Done — "+data.total+" patients processed, "+data.high_risk+" high risk","success");
      } catch(e){ showToast("Bulk import failed: "+e.message,"error"); }
      setLoading(false);
    };

    const downloadTemplate = () => {
      var NL = "\n";
      var rows = [
        "patient_name,age,time_in_hospital,num_lab_procedures,num_procedures,num_medications,number_outpatient,number_emergency,number_inpatient,number_diagnoses,insulin,change,diabetesMed,ward,patient_encounter_count",
        "John Smith,72,5,42,2,18,0,1,2,8,Steady,No,Yes,Cardiology,3",
        "Priya Patel,65,3,28,1,11,1,0,0,5,No,Ch,Yes,Medicine,1"
      ];
      var blob = new Blob([rows.join(NL)], {type:"text/csv"});
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href = url; a.download = "bulk_import_template.csv";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    };

    const exportCSV = () => {
      if(!results || !results.results) return;
      var NL = "\n";
      var headers = ["Patient ID","Name","Result","Probability","Ward"];
      var csvRows = results.results.map(function(r){
        var cells = [r.patient_id, r.patient_name, r.result, r.probability, r.ward||""];
        return cells.map(function(v){
          var s = String(v == null ? "" : v).replace(/"/g, '""');
          return '"' + s + '"';
        }).join(",");
      });
      var blob = new Blob([headers.join(",") + NL + csvRows.join(NL)], {type:"text/csv"});
      var url  = URL.createObjectURL(blob);
      var a    = document.createElement("a");
      a.href = url; a.download = "bulk_results.csv";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      showToast("CSV exported","success");
    };

    return (
      <div className="page">
        <div className="card" style={{marginBottom:16}}>
          <div className="card-title">📥 Bulk CSV Import</div>
          <div className="card-sub" style={{marginBottom:16}}>
            Upload a CSV with patient data and run predictions on all rows at once. Max 500 patients per file.
          </div>

          <div style={{display:"flex",gap:10,marginBottom:20,flexWrap:"wrap"}}>
            <button onClick={downloadTemplate}
              style={{padding:"8px 18px",background:"var(--surface2)",color:"var(--accent)",border:"1.5px solid var(--accent)",borderRadius:8,fontFamily:"inherit",fontSize:"0.83rem",fontWeight:600,cursor:"pointer"}}>
              📄 Download Template CSV
            </button>
          </div>

          <div style={{border:"2px dashed var(--border)",borderRadius:12,padding:"28px 20px",textAlign:"center",
            marginBottom:16,cursor:"pointer",background:"var(--surface2)"}}
            onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="var(--accent)";}}
            onDragLeave={e=>e.currentTarget.style.borderColor="var(--border)"}
            onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="var(--border)";
              const f=e.dataTransfer.files[0]; if(f) handleFile({target:{files:[f]}});}}>
            <div style={{fontSize:"2.5rem",marginBottom:8}}>📊</div>
            <div style={{fontWeight:600,color:"var(--text)",marginBottom:4,fontSize:"0.9rem"}}>Drag and drop a CSV file here</div>
            <div style={{color:"var(--text-muted)",fontSize:"0.78rem",marginBottom:14}}>or click to browse</div>
            <input type="file" accept=".csv" onChange={handleFile} style={{display:"none"}} id="csv-upload"/>
            <label htmlFor="csv-upload"
              style={{padding:"8px 22px",background:"var(--accent)",color:"white",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontSize:"0.83rem",fontWeight:600}}>
              Choose File
            </label>
            {file && (
              <div style={{marginTop:12,fontSize:"0.8rem",color:"var(--success)",fontWeight:600}}>
                {"✅ " + file.name + " — " + parsedRows.length + " rows detected"}
              </div>
            )}
          </div>

          {preview.length > 0 && (
            <div style={{marginBottom:16}}>
              <div style={{fontSize:"0.78rem",fontWeight:700,color:"var(--text-muted)",textTransform:"uppercase",letterSpacing:"0.4px",marginBottom:8}}>
                Preview (first 5 rows)
              </div>
              <div className="table-wrap" style={{maxHeight:180,overflow:"auto"}}>
                <table style={{fontSize:"0.76rem"}}>
                  <thead><tr>{Object.keys(preview[0]).slice(0,8).map(k=><th key={k}>{k}</th>)}</tr></thead>
                  <tbody>{preview.map((row,i)=>(
                    <tr key={i}>{Object.values(row).slice(0,8).map((v,j)=><td key={j}>{v||"—"}</td>)}</tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}

          {parsedRows.length > 0 && (
            <button onClick={runBulk} disabled={loading}
              style={{width:"100%",padding:"11px",background:"linear-gradient(135deg,var(--accent),var(--accent2))",
                color:"white",border:"none",borderRadius:8,fontFamily:"inherit",fontSize:"0.9rem",
                fontWeight:700,cursor:loading?"not-allowed":"pointer",boxShadow:"0 3px 14px rgba(2,132,199,0.35)"}}>
              {loading ? ("⏳ Processing " + parsedRows.length + " patients…") : ("🚀 Run Predictions on " + parsedRows.length + " Patients")}
            </button>
          )}
        </div>

        {results && (
          <div className="card">
            <div style={{display:"flex",gap:16,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
              <div className="kpi" style={{flex:1,minWidth:120}}>
                <div className="kpi-val">{results.total}</div>
                <div className="kpi-key">Total Processed</div>
              </div>
              <div className="kpi" style={{flex:1,minWidth:120,borderColor:"rgba(220,38,38,0.2)"}}>
                <div className="kpi-val" style={{color:"var(--danger)"}}>{results.high_risk}</div>
                <div className="kpi-key">High Risk</div>
              </div>
              <div className="kpi" style={{flex:1,minWidth:120,borderColor:"rgba(5,150,105,0.2)"}}>
                <div className="kpi-val" style={{color:"var(--success)"}}>{results.low_risk}</div>
                <div className="kpi-key">Low Risk</div>
              </div>
              <button onClick={exportCSV}
                style={{padding:"8px 16px",background:"var(--success)",color:"white",border:"none",borderRadius:8,fontSize:"0.8rem",fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
                ⬇ Export CSV
              </button>
            </div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>#</th><th>Patient ID</th><th>Name</th><th>Result</th><th>Probability</th><th>Ward</th></tr></thead>
                <tbody>
                  {results.results.map((r,i)=>(
                    <tr key={i}>
                      <td style={{color:"var(--text-muted)",fontSize:"0.75rem"}}>{i+1}</td>
                      <td><span className="badge badge-pid">{r.patient_id||"ERR"}</span></td>
                      <td style={{fontWeight:600}}>{r.patient_name}</td>
                      <td><span className={"badge "+(r.result==="High Risk"?"badge-danger":"badge-success")}>{r.result}</span></td>
                      <td style={{fontFamily:"'JetBrains Mono',monospace"}}>{r.probability ? (r.probability+"%") : "—"}</td>
                      <td style={{fontSize:"0.76rem",color:"var(--text-muted)"}}>{r.ward||"—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}
      </div>
    );
  }

    const titles={
      dashboard:"Dashboard",predict:"New Prediction — Clinical Risk Assessment",
      history:"My Patients",metrics:"Model Performance",
      account:"My Account",bulkimport:"Bulk CSV Import",
      alerts:"High-Risk Alert Settings",
      allpatients:"All Patients",users:"User Management",
      systemstats:"System Analytics",activitylog:"Activity Log"
    };

    if(!user) return (
      <>
        <ServerBanner/>
        <AuthPage onLogin={handleLogin} showToast={showToast}/>
        {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      </>
    );

    return (
      <div className="shell">
        <Sidebar user={user} tab={tab} setTab={setTab} onLogout={handleLogout} dark={dark} toggleDark={toggleDark}/>
        <div className="main">
          <div className="topbar">
            <h2>{titles[tab]||"HR-Prediction-AI"}</h2>
            <div className="topbar-meta">
              <div className="status-dot"></div>
              Backend connected &nbsp;·&nbsp;
              {new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
              {user.role==="admin"&&<span style={{marginLeft:8,padding:"2px 10px",background:"var(--purple-light)",color:"var(--purple)",borderRadius:99,fontSize:"0.72rem",fontWeight:700,border:"1px solid rgba(124,58,237,0.2)"}}>Admin</span>}
            </div>
          </div>

          {/* First-login profile completion banner */}
          {!user.degree&&!user.hospital_name&&user.role!=="admin"&&(
            <div style={{margin:"0 0 0 0",padding:"10px 24px",background:"linear-gradient(90deg,#fffbeb,#fef3c7)",borderBottom:"1px solid rgba(217,119,6,0.2)",display:"flex",alignItems:"center",gap:12,justifyContent:"space-between"}}>
              <span style={{fontSize:"0.84rem",color:"#92400e"}}>⚠️ <strong>Profile incomplete</strong> — Please fill your professional details so your records are complete.</span>
              <button onClick={()=>setTab("account")} style={{padding:"5px 16px",background:"#d97706",color:"white",border:"none",borderRadius:6,fontSize:"0.78rem",fontWeight:600,cursor:"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}}>Complete Profile →</button>
            </div>
          )}
          {tab==="dashboard"   && <Dashboard user={user} showToast={showToast} setTab={setTab}/>}
          {tab==="predict"     && <Predict showToast={showToast}/>}
          {tab==="history"     && <History showToast={showToast}/>}
          {tab==="bulkimport"  && <BulkImport showToast={showToast}/>}
          {tab==="metrics"     && <ModelMetrics showToast={showToast}/>}
          {tab==="alerts"      && <AlertsConfig showToast={showToast}/>}
          {tab==="account"     && <AccountPage user={user} showToast={showToast} onLogout={handleLogout}/>}
          {tab==="allpatients" && user.role==="admin" && <AllPatients showToast={showToast}/>}
          {tab==="users"       && user.role==="admin" && <Users showToast={showToast}/>}
          {tab==="systemstats" && user.role==="admin" && <SystemStats showToast={showToast}/>}
          {tab==="activitylog" && user.role==="admin" && <ActivityLog showToast={showToast}/>}
        </div>
        {helpOpen&&<HelpDeskModal user={user} onClose={()=>setHelpOpen(false)}/>}
        <div style={{position:"fixed",bottom:24,right:24,zIndex:1000}}>
          {!helpOpen&&<div style={{
            position:"absolute",inset:"-4px",borderRadius:"50%",
            background:"rgba(2,132,199,0.25)",
            animation:"pulseGlow 2s ease infinite",pointerEvents:"none"
          }}/>}
          <button onClick={()=>setHelpOpen(h=>!h)} title="Help"
            style={{position:"relative",width:52,height:52,borderRadius:"50%",border:"none",cursor:"pointer",
              background:helpOpen?"linear-gradient(135deg,#ef4444,#dc2626)":"linear-gradient(135deg,var(--accent),var(--accent2))",
              color:"white",fontSize:"1.4rem",
              boxShadow:"0 4px 18px rgba(2,132,199,0.45)",display:"flex",alignItems:"center",justifyContent:"center",
              transition:"all 0.25s cubic-bezier(0.34,1.56,0.64,1)"}}
            onMouseEnter={e=>{e.currentTarget.style.transform="scale(1.15) rotate(10deg)";e.currentTarget.style.boxShadow="0 8px 26px rgba(2,132,199,0.6)";}}
            onMouseLeave={e=>{e.currentTarget.style.transform="scale(1) rotate(0deg)";e.currentTarget.style.boxShadow="0 4px 18px rgba(2,132,199,0.45)";}}>
            <span style={{transition:"transform 0.25s",display:"inline-block",transform:helpOpen?"rotate(180deg)":"none"}}>{helpOpen?"✕":"?"}</span>
          </button>
        </div>
        {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      </div>
    );
  }

  // Mark app as mounted — hides boot loader
  window.__reactMounted = true;
  const _bootEl = document.getElementById("boot-loader");
  if (_bootEl) _bootEl.style.display = "none";
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
  <script>
    // Hide boot loader once React mounts, or show error if it fails
    window.__reactMounted = false;
    const _origRender = ReactDOM.render || (ReactDOM.createRoot ? ReactDOM.createRoot : null);

    // Fallback: if nothing renders in 8 seconds, show an error
    setTimeout(function() {
      if (!window.__reactMounted) {
        const loader = document.getElementById("boot-loader");
        const errBox = document.getElementById("boot-error");
        if (loader && errBox) {
          errBox.style.display = "block";
          errBox.innerHTML =
            "<strong>⚠️ App failed to load</strong><br><br>" +
            "Open browser DevTools (F12) → Console tab to see the exact error.<br><br>" +
            "<strong>Most common causes:</strong><br>" +
            "• Flask server not running (start with <code>python app.py</code>)<br>" +
            "• Opened as file:// instead of http://127.0.0.1:10000<br>" +
            "• Missing internet connection (CDN scripts blocked)";
        }
      }
    }, 8000);

    // Catch global JS errors and show them
    window.addEventListener("error", function(e) {
      const errBox = document.getElementById("boot-error");
      if (errBox && !window.__reactMounted) {
        errBox.style.display = "block";
        errBox.innerHTML = "<strong>⚠️ JavaScript Error:</strong><br>" + (e.message || "Unknown error") +
          "<br><small style='color:#991b1b'>" + (e.filename ? e.filename.split('/').pop() : "") + " line " + e.lineno + "</small>";
      }
    });
  </script>
</body>
</html>
