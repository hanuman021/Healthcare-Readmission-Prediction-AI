<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedAI — Readmission Intelligence Platform</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --surface: #0e1220;
      --surface2: #141826;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.15);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.25);
      --accent2: #06b6d4;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --sidebar-w: 240px;
      --header-h: 64px;
      --radius: 12px;
      --radius-lg: 18px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

    /* ══════════════════════════════
       LOGIN
    ══════════════════════════════ */
    .auth-scene {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 60% 50% at 70% 20%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(6,182,212,0.08) 0%, transparent 60%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      padding: 48px 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .auth-logo {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .auth-card h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field input, .field select {
      width: 100%;
      padding: 11px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field select option { background: #1e293b; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      box-shadow: 0 4px 16px rgba(59,130,246,0.3);
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .btn-ghost:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.03); }

    .auth-toggle {
      margin-top: 24px;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .auth-toggle span {
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    .auth-toggle span:hover { text-decoration: underline; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 9999;
      animation: fadeUp 0.3s ease;
      max-width: 340px;
    }

    .toast-success { background: #14532d; border: 1px solid var(--success); color: #86efac; }
    .toast-error   { background: #450a0a; border: 1px solid var(--danger);  color: #fca5a5; }
    .toast-info    { background: #1e3a5f; border: 1px solid var(--accent);  color: #93c5fd; }

    /* ══════════════════════════════
       APP SHELL
    ══════════════════════════════ */
    .shell {
      display: flex;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0;
      height: 100vh;
      z-index: 100;
      transition: transform 0.3s;
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand-name {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 8px 4px;
      margin-top: 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: all 0.15s;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text);
    }

    .nav-item.active {
      background: rgba(59,130,246,0.12);
      color: var(--accent);
      border-color: rgba(59,130,246,0.2);
    }

    .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-user {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.72rem; color: var(--text-muted); }

    .logout-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 18px;
      transition: color 0.15s;
      padding: 4px;
      border-radius: 6px;
    }

    .logout-btn:hover { color: var(--danger); }

    /* ── MAIN ── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,9,15,0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar h2 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .topbar-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .page {
      flex: 1;
      padding: 32px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 8px;
    }

    .card-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ══════════════════════════════
       DASHBOARD
    ══════════════════════════════ */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .kpi:hover { border-color: var(--border-hover); }

    .kpi::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      border-radius: 50%;
      filter: blur(24px);
      opacity: 0.25;
    }

    .kpi.blue::before  { background: var(--accent); }
    .kpi.red::before   { background: var(--danger); }
    .kpi.green::before { background: var(--success); }
    .kpi.amber::before { background: var(--warning); }

    .kpi-icon { font-size: 20px; margin-bottom: 12px; }
    .kpi-val  { font-size: 2rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; }
    .kpi-label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; }

    .kpi.blue .kpi-val  { color: #60a5fa; }
    .kpi.red .kpi-val   { color: #f87171; }
    .kpi.green .kpi-val { color: #4ade80; }
    .kpi.amber .kpi-val { color: #fbbf24; }

    .charts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .charts-grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .chart-wrap {
      position: relative;
      height: 220px;
    }

    .chart-wrap.tall {
      height: 280px;
    }

    /* ══════════════════════════════
       MODEL METRICS
    ══════════════════════════════ */
    .metric-bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .metric-bar-label {
      font-size: 0.82rem;
      color: var(--text-dim);
      width: 100px;
      flex-shrink: 0;
    }

    .metric-bar-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .metric-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 1s ease;
    }

    .metric-bar-val {
      font-size: 0.82rem;
      font-weight: 600;
      font-family: 'DM Mono', monospace;
      color: var(--text);
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Confusion Matrix */
    .cm-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .cm-cell {
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }

    .cm-cell.tn { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2); }
    .cm-cell.fp { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); }
    .cm-cell.fn { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.15); }
    .cm-cell.tp { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); }

    .cm-val  { font-size: 1.6rem; font-weight: 700; font-family: 'DM Mono', monospace; }
    .cm-key  { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }

    .cm-cell.tn .cm-val { color: var(--success); }
    .cm-cell.fp .cm-val { color: var(--danger); }
    .cm-cell.fn .cm-val { color: #fb923c; }
    .cm-cell.tp .cm-val { color: #60a5fa; }

    /* ══════════════════════════════
       PREDICT
    ══════════════════════════════ */
    .predict-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      align-items: start;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .slider-group {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .slider-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      font-family: 'DM Mono', monospace;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(255,255,255,0.1);
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 2px 8px var(--accent-glow);
      transition: box-shadow 0.2s;
    }

    input[type=range]:hover::-webkit-slider-thumb {
      box-shadow: 0 2px 12px rgba(59,130,246,0.5);
    }

    .result-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      text-align: center;
    }

    .result-ring {
      width: 140px; height: 140px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      border: 3px solid var(--border);
      transition: all 0.4s ease;
      font-size: 2.5rem;
    }

    .result-ring.high {
      border-color: var(--danger);
      background: rgba(239,68,68,0.08);
      box-shadow: 0 0 40px rgba(239,68,68,0.2);
    }

    .result-ring.low {
      border-color: var(--success);
      background: rgba(34,197,94,0.08);
      box-shadow: 0 0 40px rgba(34,197,94,0.2);
    }

    .result-label {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .result-label.high { color: var(--danger); }
    .result-label.low  { color: var(--success); }

    .prob-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 16px 0;
    }

    .prob-item { text-align: center; }
    .prob-num  { font-size: 1.4rem; font-weight: 700; font-family: 'DM Mono', monospace; }
    .prob-key  { font-size: 0.72rem; color: var(--text-muted); }

    .recommend-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: left;
      margin-top: 20px;
    }

    .recommend-box h4 { font-size: 0.82rem; font-weight: 700; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

    .recommend-box ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .recommend-box li { font-size: 0.84rem; color: var(--text-dim); display: flex; gap: 8px; align-items: flex-start; }
    .recommend-box li::before { content: '→'; color: var(--accent); flex-shrink: 0; font-weight: 700; }

    /* ══════════════════════════════
       HISTORY TABLE
    ══════════════════════════════ */
    .table-wrap {
      overflow-x: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 11px 16px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 13px 16px;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim);
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-danger  { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .badge-success { background: rgba(34,197,94,0.12);  color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .badge-admin   { background: rgba(139,92,246,0.12); color: #a78bfa; border: 1px solid rgba(139,92,246,0.25); }
    .badge-user    { background: rgba(6,182,212,0.12);  color: #22d3ee; border: 1px solid rgba(6,182,212,0.25); }

    /* ══════════════════════════════
       USER MANAGEMENT
    ══════════════════════════════ */
    .del-btn {
      background: none;
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
      padding: 5px 12px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }

    .del-btn:hover { background: rgba(239,68,68,0.1); border-color: var(--danger); }

    /* ══════════════════════════════
       LOADING
    ══════════════════════════════ */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 60px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-state .emoji { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.95rem; }

    /* ══════════════════════════════
       RESPONSIVE
    ══════════════════════════════ */
    @media (max-width: 900px) {
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      .charts-grid3 { grid-template-columns: 1fr; }
      .predict-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .sidebar { transform: translateX(-100%); }
      .main { margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  const API = "http://localhost:5000";

  // ─── IN-MEMORY TOKEN STORE (no localStorage needed) ──────────
  let _token = null;

  const api = (path, opts = {}) => {
    return fetch(`${API}${path}`, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        ...(_token ? { "X-Auth-Token": _token } : {}),
        ...(opts.headers || {})
      }
    }).then(async r => {
      const text = await r.text();
      try { return JSON.parse(text); }
      catch { return { error: text || `HTTP ${r.status}` }; }
    });
  };

  // ─── TOAST ────────────────────────────────────────────────────
  function Toast({ msg, type, onClose }) {
    useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
    return (
      <div className={`toast toast-${type}`} style={{ cursor:'pointer' }} onClick={onClose}>
        {msg}
      </div>
    );
  }

  // ─── CHART HELPERS ────────────────────────────────────────────
  function useChart(ref, cfg, deps) {
    const inst = useRef(null);
    useEffect(() => {
      if (!ref.current || !cfg) return;
      if (inst.current) { inst.current.destroy(); inst.current = null; }
      try { inst.current = new Chart(ref.current, cfg); }
      catch(e) { console.error("Chart error:", e); }
      return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
    }, deps);
  }

  // ══════════════════════════════
  //  AUTH
  // ══════════════════════════════
  function AuthPage({ onLogin, showToast }) {
    const [mode, setMode] = useState("login");
    const [form, setForm] = useState({ username:"", password:"", role:"user" });
    const [loading, setLoading] = useState(false);

    const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

    const submit = async () => {
      if (!form.username || !form.password) { showToast("Fill in all fields", "error"); return; }
      setLoading(true);
      try {
        const endpoint = mode === "login" ? "/login" : "/register";
        const data = await api(endpoint, { method:"POST", body: JSON.stringify(form) });
        if (mode === "login" && data.token) {
          _token = data.token;
          onLogin({ username: data.username, role: data.role });
          showToast(`Welcome back, ${data.username}!`, "success");
        } else if (mode === "register" && data.message === "User registered successfully") {
          showToast("Account created! Please log in.", "success");
          setMode("login");
        } else {
          showToast(data.message || "Something went wrong", "error");
        }
      } catch (err) {
        showToast("Cannot reach server. Make sure Flask is running on port 5000.", "error");
      }
      setLoading(false);
    };

    return (
      <div className="auth-scene">
        <div className="auth-card">
          <div className="auth-logo">🏥</div>
          <h1>MedAI Platform</h1>
          <p>{mode === "login" ? "Sign in to your workspace" : "Create your account"}</p>

          <div className="field">
            <label>Username</label>
            <input value={form.username} onChange={set("username")}
              placeholder="Enter username"
              onKeyDown={e => e.key === "Enter" && submit()} />
          </div>

          <div className="field">
            <label>Password</label>
            <input type="password" value={form.password} onChange={set("password")}
              placeholder="Enter password"
              onKeyDown={e => e.key === "Enter" && submit()} />
          </div>

          {mode === "register" && (
            <div className="field">
              <label>Role</label>
              <select value={form.role} onChange={set("role")}>
                <option value="user">Clinician</option>
                <option value="admin">Administrator</option>
              </select>
            </div>
          )}

          <button className="btn btn-primary" onClick={submit} disabled={loading}>
            {loading ? "Please wait…" : mode === "login" ? "Sign In" : "Create Account"}
          </button>

          <div className="auth-toggle" style={{ marginTop: 16 }}>
            {mode === "login" ? (
              <>No account? <span onClick={() => setMode("register")}>Register</span></>
            ) : (
              <>Have an account? <span onClick={() => setMode("login")}>Sign In</span></>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ══════════════════════════════
  //  SIDEBAR
  // ══════════════════════════════
  function Sidebar({ user, tab, setTab, onLogout }) {
    const items = [
      { key:"dashboard", icon:"📊", label:"Dashboard" },
      { key:"predict",   icon:"🔮", label:"New Prediction" },
      { key:"history",   icon:"📜", label:"History" },
      { key:"metrics",   icon:"📈", label:"Model Performance" },
      ...(user.role === "admin" ? [{ key:"users", icon:"👥", label:"Users" }] : [])
    ];

    return (
      <aside className="sidebar">
        <div className="sidebar-brand">
          <div className="brand-icon">🏥</div>
          <div>
            <div className="brand-name">MedAI</div>
            <div className="brand-sub">Readmission Intel</div>
          </div>
        </div>

        <nav className="sidebar-nav">
          <div className="nav-label">Navigation</div>
          {items.map(it => (
            <div key={it.key}
              className={`nav-item ${tab === it.key ? "active" : ""}`}
              onClick={() => setTab(it.key)}>
              <span className="nav-icon">{it.icon}</span>
              {it.label}
            </div>
          ))}
        </nav>

        <div className="sidebar-user">
          <div className="user-avatar">{user.username[0].toUpperCase()}</div>
          <div className="user-info">
            <div className="user-name">{user.username}</div>
            <div className="user-role">{user.role === "admin" ? "Administrator" : "Clinician"}</div>
          </div>
          <button className="logout-btn" title="Sign out" onClick={onLogout}>⏻</button>
        </div>
      </aside>
    );
  }

  // ══════════════════════════════
  //  DASHBOARD
  // ══════════════════════════════
  function Dashboard({ user, showToast }) {
    const [stats, setStats] = useState(null);
    const donutRef = useRef(null);
    const trendRef = useRef(null);

    useEffect(() => {
      api("/dashboard-data").then(d => setStats(d)).catch(() => showToast("Failed to load stats","error"));
    }, []);

    const donutCfg = stats ? {
      type: "doughnut",
      data: {
        labels: ["High Risk", "Low Risk"],
        datasets: [{
          data: [stats.high, stats.low],
          backgroundColor: ["rgba(239,68,68,0.85)", "rgba(34,197,94,0.85)"],
          borderWidth: 0, hoverOffset: 8
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout:"72%",
        plugins: { legend: { position:"bottom", labels:{ color:"#94a3b8", boxWidth:12, padding:16, font:{size:12} } } }
      }
    } : null;

    const trendCfg = stats && stats.trend ? {
      type: "line",
      data: {
        labels: stats.trend.map(t => t.date || ""),
        datasets: [{
          label: "Predictions",
          data: stats.trend.map(t => t.count),
          borderColor: "#3b82f6",
          backgroundColor: "rgba(59,130,246,0.08)",
          fill: true, tension: 0.4,
          pointBackgroundColor: "#3b82f6", pointRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks:{ color:"#475569", font:{size:11} }, grid:{ color:"rgba(255,255,255,0.04)" } },
          y: { ticks:{ color:"#475569", font:{size:11} }, grid:{ color:"rgba(255,255,255,0.04)" }, min: 0 }
        }
      }
    } : null;

    useChart(donutRef, donutCfg, [JSON.stringify(stats)]);
    useChart(trendRef, trendCfg, [JSON.stringify(stats)]);

    if (!stats) return <div className="spinner" />;

    const rate = stats.total > 0 ? Math.round((stats.high / stats.total) * 100) : 0;

    return (
      <div className="page">
        <div className="kpi-grid">
          <div className="kpi blue">
            <div className="kpi-icon">🔮</div>
            <div className="kpi-val">{stats.total}</div>
            <div className="kpi-label">Total Predictions</div>
          </div>
          <div className="kpi red">
            <div className="kpi-icon">⚠️</div>
            <div className="kpi-val">{stats.high}</div>
            <div className="kpi-label">High Risk Cases</div>
          </div>
          <div className="kpi green">
            <div className="kpi-icon">✅</div>
            <div className="kpi-val">{stats.low}</div>
            <div className="kpi-label">Low Risk Cases</div>
          </div>
          <div className="kpi amber">
            <div className="kpi-icon">📊</div>
            <div className="kpi-val">{rate}%</div>
            <div className="kpi-label">High Risk Rate</div>
          </div>
        </div>

        <div className="charts-grid">
          <div className="card">
            <div className="card-title">📊 Risk Distribution</div>
            <div className="card-sub">Breakdown of prediction outcomes</div>
            <div className="chart-wrap">
              <canvas ref={donutRef}></canvas>
            </div>
          </div>

          <div className="card">
            <div className="card-title">📈 7-Day Activity</div>
            <div className="card-sub">Predictions submitted over last 7 days</div>
            <div className="chart-wrap">
              {stats.trend && stats.trend.length > 0
                ? <canvas ref={trendRef}></canvas>
                : <div className="empty-state"><div className="emoji">📭</div><p>No trend data yet</p></div>
              }
            </div>
          </div>
        </div>

        {user.role === "admin" && (
          <div className="card">
            <div className="card-title">👥 Platform Overview</div>
            <div className="card-sub">System-wide statistics</div>
            <div style={{ display:"flex", gap:24, marginTop:8 }}>
              <div>
                <div style={{ fontSize:"1.8rem", fontWeight:700, color:"#a78bfa" }}>{stats.active_users}</div>
                <div style={{ fontSize:"0.8rem", color:"var(--text-muted)" }}>Active Users</div>
              </div>
              <div>
                <div style={{ fontSize:"1.8rem", fontWeight:700, color:"#22d3ee" }}>{stats.total}</div>
                <div style={{ fontSize:"0.8rem", color:"var(--text-muted)" }}>All-Time Predictions</div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ══════════════════════════════
  //  PREDICT
  // ══════════════════════════════
  function Predict({ showToast }) {
    const [vals, setVals] = useState({
      age: 55,
      time_in_hospital: 3,
      num_lab_procedures: 40,
      num_procedures: 1,
      num_medications: 15,
      number_outpatient: 0,
      number_emergency: 0,
      number_inpatient: 0,
      number_diagnoses: 7,
      insulin: "No",
      change: "No",
      diabetesMed: "Yes",
    });
    const [result, setResult] = useState(null);
    const [loading, setLoading] = useState(false);

    const setNum = k => e => setVals(v => ({ ...v, [k]: Number(e.target.value) }));
    const setSel = k => e => setVals(v => ({ ...v, [k]: e.target.value }));

    const sliders = [
      { key:"age",                label:"Patient Age",            min:5,  max:95,  step:10, unit:"yrs" },
      { key:"time_in_hospital",   label:"Days in Hospital",       min:1,  max:14,  step:1,  unit:"days" },
      { key:"num_lab_procedures", label:"Lab Procedures",         min:1,  max:132, step:1,  unit:"tests" },
      { key:"num_procedures",     label:"Procedures Performed",   min:0,  max:6,   step:1,  unit:"procs" },
      { key:"num_medications",    label:"Num Medications",        min:1,  max:81,  step:1,  unit:"meds" },
      { key:"number_outpatient",  label:"Prior Outpatient Visits",min:0,  max:42,  step:1,  unit:"visits" },
      { key:"number_emergency",   label:"Prior ER Visits",        min:0,  max:20,  step:1,  unit:"visits" },
      { key:"number_inpatient",   label:"Prior Inpatient Visits", min:0,  max:21,  step:1,  unit:"visits" },
      { key:"number_diagnoses",   label:"Number of Diagnoses",    min:1,  max:16,  step:1,  unit:"diags" },
    ];

    const dropdowns = [
      { key:"insulin",    label:"Insulin Use",         opts:["No","Steady","Up","Down"] },
      { key:"change",     label:"Medication Changed",  opts:["No","Ch"] },
      { key:"diabetesMed",label:"On Diabetes Med",     opts:["Yes","No"] },
    ];

    const submit = async () => {
      setLoading(true);
      try {
        const data = await api("/predict", { method:"POST", body: JSON.stringify(vals) });
        if (data.prediction) {
          setResult(data);
          showToast(`Prediction: ${data.prediction}`, data.prediction === "High Risk" ? "error" : "success");
        } else {
          showToast(data.error || "Prediction failed", "error");
        }
      } catch(e) {
        showToast("Server error: " + e.message, "error");
      }
      setLoading(false);
    };

    const isHigh = result?.prediction === "High Risk";

    const recommendations = isHigh
      ? ["Schedule follow-up within 7 days of discharge","Review medication adherence plan","Coordinate with social services","Consider extended monitoring period"]
      : ["Standard post-discharge follow-up","Routine medication review","Patient education materials","Schedule 30-day check-in"];

    return (
      <div className="page">
        <div className="predict-layout">
          <div className="card">
            <div className="card-title">🔮 Patient Risk Assessment</div>
            <div className="card-sub">12-feature model — adjust all parameters then run prediction</div>

            <div className="form-grid">
              {sliders.map(s => (
                <div key={s.key} className="slider-group">
                  <div className="slider-header">
                    <span className="slider-label">{s.label}</span>
                    <span className="slider-val">{vals[s.key]} <span style={{ fontSize:"0.7rem", color:"var(--text-muted)", fontFamily:"inherit" }}>{s.unit}</span></span>
                  </div>
                  <input type="range" min={s.min} max={s.max} step={s.step} value={vals[s.key]} onChange={setNum(s.key)} />
                </div>
              ))}
            </div>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:12, marginBottom:24 }}>
              {dropdowns.map(d => (
                <div key={d.key}>
                  <div style={{ fontSize:"0.78rem", fontWeight:600, color:"var(--text-muted)", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:6 }}>{d.label}</div>
                  <select value={vals[d.key]} onChange={setSel(d.key)}
                    style={{ width:"100%", padding:"9px 12px", background:"rgba(255,255,255,0.04)",
                      border:"1px solid var(--border)", borderRadius:8, color:"var(--text)",
                      fontFamily:"inherit", fontSize:"0.9rem", outline:"none", cursor:"pointer" }}>
                    {d.opts.map(o => <option key={o} value={o}>{o === "Ch" ? "Changed" : o}</option>)}
                  </select>
                </div>
              ))}
            </div>

            <button className="btn btn-primary" onClick={submit} disabled={loading}
              style={{ width:"auto", padding:"12px 36px" }}>
              {loading ? "Analyzing…" : "Run Prediction →"}
            </button>
          </div>

          <div className="result-panel">
            <div className={`result-ring ${result ? (isHigh ? "high" : "low") : ""}`}>
              {result ? (isHigh ? "⚠️" : "✅") : "🔮"}
            </div>

            {result ? (
              <>
                <div className={`result-label ${isHigh ? "high" : "low"}`}>
                  {result.prediction}
                </div>
                {result.probability && (
                  <div className="prob-row">
                    <div className="prob-item">
                      <div className="prob-num" style={{ color: isHigh ? "var(--danger)" : "var(--success)" }}>
                        {result.probability}%
                      </div>
                      <div className="prob-key">Confidence</div>
                    </div>
                  </div>
                )}
                <div className="recommend-box">
                  <h4>Clinical Recommendations</h4>
                  <ul>
                    {recommendations.map((r,i) => <li key={i}>{r}</li>)}
                  </ul>
                </div>
              </>
            ) : (
              <div style={{ color:"var(--text-muted)", fontSize:"0.9rem", marginTop: 12 }}>
                Set patient parameters and run the assessment
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  // ══════════════════════════════
  //  HISTORY
  // ══════════════════════════════
  function History({ showToast }) {
    const [rows, setRows] = useState([]);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      api("/history").then(d => { setRows(d.history || []); setLoading(false); })
        .catch(() => { showToast("Failed to load history","error"); setLoading(false); });
    }, []);

    if (loading) return <div className="page"><div className="spinner"/></div>;

    return (
      <div className="page">
        <div className="card">
          <div className="card-title">📜 Prediction History</div>
          <div className="card-sub">{rows.length} records — most recent first</div>

          {rows.length === 0 ? (
            <div className="empty-state">
              <div className="emoji">📭</div>
              <p>No predictions yet. Head to "New Prediction" to get started.</p>
            </div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Age</th>
                    <th>Hosp Days</th>
                    <th>Lab Tests</th>
                    <th>Procedures</th>
                    <th>Medications</th>
                    <th>Outpatient</th>
                    <th>Emergency</th>
                    <th>Inpatient</th>
                    <th>Diagnoses</th>
                    <th>Insulin</th>
                    <th>Med Change</th>
                    <th>Diabetes Med</th>
                    <th>Confidence</th>
                    <th>Result</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((row, i) => (
                    <tr key={i}>
                      <td style={{ color:"var(--text-muted)", fontFamily:"'DM Mono',monospace", fontSize:"0.8rem" }}>{String(rows.length - i).padStart(3,"0")}</td>
                      <td>{row.age ?? "—"}</td>
                      <td>{row.time_in_hospital}</td>
                      <td>{row.num_lab_procedures}</td>
                      <td>{row.num_procedures ?? "—"}</td>
                      <td>{row.num_medications}</td>
                      <td>{row.number_outpatient ?? "—"}</td>
                      <td>{row.number_emergency ?? "—"}</td>
                      <td>{row.number_inpatient}</td>
                      <td>{row.number_diagnoses ?? "—"}</td>
                      <td>{row.insulin ?? "—"}</td>
                      <td>{row.change === "Ch" ? "Yes" : row.change === "No" ? "No" : "—"}</td>
                      <td>{row.diabetesMed ?? "—"}</td>
                      <td style={{ fontFamily:"'DM Mono',monospace" }}>{row.probability ? `${row.probability}%` : "—"}</td>
                      <td><span className={`badge ${row.result === "High Risk" ? "badge-danger" : "badge-success"}`}>{row.result}</span></td>
                      <td style={{ color:"var(--text-muted)", fontSize:"0.8rem" }}>{row.created_at ? row.created_at.split(" ")[0] : "—"}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ══════════════════════════════
  //  MODEL METRICS
  // ══════════════════════════════
  function ModelMetrics({ showToast }) {
    const [metrics, setMetrics] = useState(null);
    const rocRef = useRef(null);
    const impRef = useRef(null);

    useEffect(() => {
      api("/model-metrics").then(d => setMetrics(d))
        .catch(() => showToast("Failed to load model metrics","error"));
    }, []);

    const rocCfg = metrics ? {
      type: "line",
      data: {
        labels: metrics.roc_curve.map(p => p.fpr.toFixed(2)),
        datasets: [
          {
            label: `ROC Curve (AUC = ${metrics.auc_roc})`,
            data: metrics.roc_curve.map(p => p.tpr),
            borderColor: "#3b82f6", backgroundColor: "rgba(59,130,246,0.08)",
            fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2
          },
          {
            label: "Random Classifier",
            data: metrics.roc_curve.map(p => p.fpr),
            borderColor: "rgba(255,255,255,0.2)", borderDash: [6,4],
            fill: false, pointRadius: 0, borderWidth: 1.5, tension: 0
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels:{ color:"#94a3b8", font:{size:11} } } },
        scales: {
          x: { title:{ display:true, text:"False Positive Rate", color:"#475569", font:{size:11} },
               ticks:{ color:"#475569", font:{size:10} }, grid:{ color:"rgba(255,255,255,0.04)" } },
          y: { title:{ display:true, text:"True Positive Rate", color:"#475569", font:{size:11} },
               ticks:{ color:"#475569", font:{size:10} }, grid:{ color:"rgba(255,255,255,0.04)" }, min:0, max:1 }
        }
      }
    } : null;

    const impCfg = metrics ? {
      type: "bar",
      data: {
        labels: metrics.feature_importance.map(f => f.feature),
        datasets: [{
          label: "Importance",
          data: metrics.feature_importance.map(f => f.importance),
          backgroundColor: ["rgba(59,130,246,0.8)", "rgba(6,182,212,0.8)", "rgba(139,92,246,0.8)", "rgba(245,158,11,0.8)"],
          borderRadius: 6, borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, indexAxis: "y",
        plugins: { legend:{ display:false } },
        scales: {
          x: { ticks:{ color:"#475569", font:{size:11} }, grid:{ color:"rgba(255,255,255,0.04)" }, min:0, max:0.5 },
          y: { ticks:{ color:"#94a3b8", font:{size:11} }, grid:{ display:false } }
        }
      }
    } : null;

    useChart(rocRef, rocCfg, [JSON.stringify(metrics)]);
    useChart(impRef, impCfg, [JSON.stringify(metrics)]);

    if (!metrics) return <div className="page"><div className="spinner"/></div>;

    const bars = [
      { label:"Accuracy",  val: metrics.accuracy },
      { label:"Precision", val: metrics.precision },
      { label:"Recall",    val: metrics.recall },
      { label:"F1 Score",  val: metrics.f1_score },
      { label:"AUC-ROC",   val: metrics.auc_roc },
    ];

    const cm = metrics.confusion_matrix;

    return (
      <div className="page">
        {/* Performance bars */}
        <div className="card" style={{ marginBottom: 20 }}>
          <div className="card-title">🎯 Model Performance Metrics</div>
          <div className="card-sub">XGBoost classifier trained on UCI Diabetes readmission dataset</div>
          <div style={{ maxWidth: 520 }}>
            {bars.map(b => (
              <div key={b.label} className="metric-bar-row">
                <span className="metric-bar-label">{b.label}</span>
                <div className="metric-bar-track">
                  <div className="metric-bar-fill" style={{ width: `${b.val * 100}%` }}></div>
                </div>
                <span className="metric-bar-val">{Math.round(b.val * 100)}%</span>
              </div>
            ))}
          </div>
        </div>

        <div className="charts-grid" style={{ marginBottom: 20 }}>
          {/* ROC Curve */}
          <div className="card">
            <div className="card-title">📉 ROC Curve</div>
            <div className="card-sub">Receiver Operating Characteristic — AUC: {metrics.auc_roc}</div>
            <div className="chart-wrap tall">
              <canvas ref={rocRef}></canvas>
            </div>
          </div>

          {/* Confusion Matrix */}
          <div className="card">
            <div className="card-title">🔲 Confusion Matrix</div>
            <div className="card-sub">Model predictions vs. actual outcomes on test set</div>
            <div style={{ display:"grid", gridTemplateColumns:"auto 1fr 1fr", gap:"8px", marginTop:12 }}>
              <div></div>
              <div style={{ textAlign:"center", fontSize:"0.72rem", color:"var(--text-muted)", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.5px" }}>Predicted: Low</div>
              <div style={{ textAlign:"center", fontSize:"0.72rem", color:"var(--text-muted)", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.5px" }}>Predicted: High</div>
              <div style={{ fontSize:"0.72rem", color:"var(--text-muted)", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.5px", writingMode:"vertical-rl", textAlign:"center" }}>Actual: Low</div>
              <div className="cm-cell tn">
                <div className="cm-val">{cm.tn.toLocaleString()}</div>
                <div className="cm-key">True Negative</div>
              </div>
              <div className="cm-cell fp">
                <div className="cm-val">{cm.fp.toLocaleString()}</div>
                <div className="cm-key">False Positive</div>
              </div>
              <div style={{ fontSize:"0.72rem", color:"var(--text-muted)", fontWeight:600, textTransform:"uppercase", letterSpacing:"0.5px", writingMode:"vertical-rl", textAlign:"center" }}>Actual: High</div>
              <div className="cm-cell fn">
                <div className="cm-val">{cm.fn.toLocaleString()}</div>
                <div className="cm-key">False Negative</div>
              </div>
              <div className="cm-cell tp">
                <div className="cm-val">{cm.tp.toLocaleString()}</div>
                <div className="cm-key">True Positive</div>
              </div>
            </div>
          </div>
        </div>

        {/* Feature Importance */}
        <div className="card">
          <div className="card-title">📌 Feature Importance</div>
          <div className="card-sub">Relative contribution of each input feature to the model's predictions</div>
          <div className="chart-wrap" style={{ height: 200 }}>
            <canvas ref={impRef}></canvas>
          </div>
        </div>
      </div>
    );
  }

  // ══════════════════════════════
  //  USER MANAGEMENT
  // ══════════════════════════════
  function Users({ showToast }) {
    const [users, setUsers] = useState([]);
    const [loading, setLoading] = useState(true);
    const [form, setForm] = useState({ username:"", password:"", role:"user" });
    const [adding, setAdding] = useState(false);
    const [confirmId, setConfirmId] = useState(null);

    const load = () => {
      setLoading(true);
      api("/users").then(d => { setUsers(d.users || []); setLoading(false); })
        .catch(() => { showToast("Failed to load users","error"); setLoading(false); });
    };

    useEffect(() => { load(); }, []);

    const deleteUser = async (id) => {
      if (confirmId !== id) { setConfirmId(id); return; }
      setConfirmId(null);
      const d = await api(`/delete-user/${id}`, { method:"DELETE" }).catch(() => null);
      if (d?.message === "User deleted successfully") {
        showToast("User deleted","success"); load();
      } else {
        showToast(d?.message || "Delete failed","error");
      }
    };

    const addUser = async () => {
      if (!form.username || !form.password) { showToast("Fill in all fields","error"); return; }
      setAdding(true);
      const d = await api("/register", { method:"POST", body: JSON.stringify(form) }).catch(() => null);
      if (d?.message === "User registered successfully") {
        showToast("User created!","success"); setForm({ username:"", password:"", role:"user" }); load();
      } else {
        showToast(d?.message || "Failed to create user","error");
      }
      setAdding(false);
    };

    const set = k => e => setForm(f => ({ ...f, [k]: e.target.value }));

    if (loading) return <div className="page"><div className="spinner"/></div>;

    return (
      <div className="page">
        {/* Add user */}
        <div className="card" style={{ marginBottom: 20 }}>
          <div className="card-title">➕ Add New User</div>
          <div className="card-sub">Create a clinician or admin account</div>
          <div style={{ display:"flex", gap:12, flexWrap:"wrap", alignItems:"flex-end" }}>
            <div className="field" style={{ margin:0, flex:"1 1 160px" }}>
              <label>Username</label>
              <input value={form.username} onChange={set("username")} placeholder="e.g. dr.smith" />
            </div>
            <div className="field" style={{ margin:0, flex:"1 1 160px" }}>
              <label>Password</label>
              <input type="password" value={form.password} onChange={set("password")} placeholder="Password" />
            </div>
            <div className="field" style={{ margin:0, flex:"0 0 140px" }}>
              <label>Role</label>
              <select value={form.role} onChange={set("role")}>
                <option value="user">Clinician</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button className="btn btn-primary" onClick={addUser} disabled={adding}
              style={{ width:"auto", padding:"11px 24px", flex:"0 0 auto" }}>
              {adding ? "Adding…" : "Add User"}
            </button>
          </div>
        </div>

        {/* Users table */}
        <div className="card">
          <div className="card-title">👥 All Users</div>
          <div className="card-sub">{users.length} registered accounts</div>
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Username</th>
                  <th>Role</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.id}>
                    <td style={{ fontFamily:"'DM Mono',monospace", fontSize:"0.8rem", color:"var(--text-muted)" }}>#{u.id}</td>
                    <td style={{ fontWeight:500 }}>{u.username}</td>
                    <td>
                      <span className={`badge ${u.role === "admin" ? "badge-admin" : "badge-user"}`}>
                        {u.role === "admin" ? "Admin" : "Clinician"}
                      </span>
                    </td>
                    <td>
                      {u.username !== "admin" && (
                        confirmId === u.id
                          ? <span style={{ display:"flex", gap:6 }}>
                              <button className="del-btn" onClick={() => deleteUser(u.id)}>Confirm?</button>
                              <button className="del-btn" style={{ borderColor:"var(--border)", color:"var(--text-muted)" }} onClick={() => setConfirmId(null)}>Cancel</button>
                            </span>
                          : <button className="del-btn" onClick={() => setConfirmId(u.id)}>Remove</button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    );
  }

  // ──────────────────────────────────────────────────────────────
  //  SERVER STATUS BANNER
  // ──────────────────────────────────────────────────────────────
  function ServerBanner() {
    const [status, setStatus] = useState("checking");
    useEffect(() => {
      fetch(`${API}/`, { method:"GET" })
        .then(r => r.ok ? setStatus("ok") : setStatus("error"))
        .catch(() => setStatus("error"));
    }, []);
    if (status === "ok") return null;
    return (
      <div style={{
        position:"fixed", top:0, left:0, right:0, zIndex:9998,
        background: status === "checking" ? "#1e293b" : "#450a0a",
        borderBottom: `1px solid ${status === "checking" ? "#334155" : "#ef4444"}`,
        padding:"10px 20px", textAlign:"center", fontSize:"0.85rem",
        color: status === "checking" ? "#94a3b8" : "#fca5a5"
      }}>
        {status === "checking"
          ? "⏳ Connecting to Flask backend on localhost:5000…"
          : "❌ Flask backend not found. Run: python app.py  — then refresh."}
      </div>
    );
  }


  function App() {
    const [user, setUser] = useState(null);
    const [tab, setTab] = useState("dashboard");
    const [toast, setToast] = useState(null);

    const showToast = (msg, type = "info") => {
      setToast({ msg, type, id: Date.now() });
    };

    const handleLogin = (u) => { setUser(u); setTab("dashboard"); };

    const handleLogout = async () => {
      try { await api("/logout", { method:"POST" }); } catch {}
      _token = null;
      setUser(null);
    };

    const titles = {
      dashboard:"Dashboard", predict:"New Prediction",
      history:"Prediction History", metrics:"Model Performance",
      users:"User Management"
    };

    if (!user) return (
      <>
        <ServerBanner />
        <AuthPage onLogin={handleLogin} showToast={showToast} />
        {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
      </>
    );

    return (
      <div className="shell">
        <Sidebar user={user} tab={tab} setTab={setTab} onLogout={handleLogout} />
        <div className="main">
          <div className="topbar">
            <h2>{titles[tab] || "MedAI"}</h2>
            <div className="topbar-meta">
              <div className="status-dot"></div>
              Backend connected &nbsp;·&nbsp; {new Date().toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" })}
            </div>
          </div>

          {tab === "dashboard" && <Dashboard user={user} showToast={showToast} />}
          {tab === "predict"   && <Predict showToast={showToast} />}
          {tab === "history"   && <History showToast={showToast} />}
          {tab === "metrics"   && <ModelMetrics showToast={showToast} />}
          {tab === "users" && user.role === "admin" && <Users showToast={showToast} />}
        </div>

        {toast && <Toast key={toast.id} msg={toast.msg} type={toast.type} onClose={() => setToast(null)} />}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
