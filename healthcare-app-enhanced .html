<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Healthcare AI - Readmission Predictor</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e27;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* 3D Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* Login Page Styles */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      padding: 50px;
      width: 100%;
      max-width: 450px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.8s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 20px;
      animation: float 3s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .login-header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header p {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    .input-group {
      margin-bottom: 25px;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: 0.6;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 15px 20px 15px 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      color: white;
      font-size: 16px;
      transition: all 0.3s;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }

    .input-group select {
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 20px center;
      cursor: pointer;
    }

    .input-group select option {
      background: #1a1f3a;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s;
    }

    .btn:hover::before {
      left: 100%;
    }

    .toggle-form {
      text-align: center;
      margin-top: 25px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .toggle-form a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .toggle-form a:hover {
      color: #764ba2;
    }

    /* Main App Container */
    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px 30px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideDown 0.8s ease;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar-brand .logo {
      width: 50px;
      height: 50px;
      font-size: 24px;
      margin: 0;
    }

    .navbar-brand h2 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .navbar-tabs {
      display: flex;
      gap: 10px;
    }

    .nav-tab {
      padding: 12px 25px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: transparent;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-badge {
      padding: 8px 16px;
      background: rgba(102, 126, 234, 0.2);
      border: 1px solid rgba(102, 126, 234, 0.4);
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .btn-logout {
      padding: 10px 20px;
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid rgba(255, 82, 82, 0.4);
      border-radius: 10px;
      color: #ff5252;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }

    .btn-logout:hover {
      background: rgba(255, 82, 82, 0.3);
      transform: translateY(-2px);
    }

    /* Card Styles */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 25px;
      padding: 35px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 0.8s ease;
    }

    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Prediction Form */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    /* 3D Result Card */
    .result-3d {
      margin-top: 30px;
      padding: 40px;
      border-radius: 25px;
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.5s ease;
    }

    .result-3d::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    .result-3d.high-risk {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      box-shadow: 0 20px 60px rgba(255, 107, 107, 0.4);
    }

    .result-3d.low-risk {
      background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
      box-shadow: 0 20px 60px rgba(81, 207, 102, 0.4);
    }

    .result-content {
      position: relative;
      z-index: 1;
    }

    .result-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      animation: bounce 2s ease-in-out infinite;
    }

    .result-3d h3 {
      font-size: 2rem;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .result-percentage {
      font-size: 3rem;
      font-weight: 800;
      margin: 20px 0;
      text-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .progress-3d {
      width: 100%;
      height: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: inset 0 3px 10px rgba(0,0,0,0.3);
    }

    .progress-fill-3d {
      height: 100%;
      background: white;
      border-radius: 15px;
      transition: width 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 0 20px rgba(255,255,255,0.5);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card-3d {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .stat-card-3d::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .stat-card-3d:hover::before {
      opacity: 1;
    }

    .stat-card-3d:hover {
      transform: translateY(-10px) scale(1.02);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
    }

    .stat-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.3));
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .stat-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
    }

    /* User Management Table */
    .table-container {
      overflow-x: auto;
      margin-top: 30px;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 15px;
      overflow: hidden;
    }

    .users-table thead {
      background: rgba(102, 126, 234, 0.2);
    }

    .users-table th,
    .users-table td {
      padding: 18px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .users-table th {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .users-table tbody tr {
      transition: all 0.3s;
    }

    .users-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .role-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .role-badge.admin {
      background: rgba(255, 107, 107, 0.2);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.4);
    }

    .role-badge.doctor {
      background: rgba(81, 207, 102, 0.2);
      color: #51cf66;
      border: 1px solid rgba(81, 207, 102, 0.4);
    }

    .role-badge.user {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
      border: 1px solid rgba(102, 126, 234, 0.4);
    }

    .btn-delete {
      padding: 8px 16px;
      background: rgba(255, 82, 82, 0.2);
      border: 1px solid rgba(255, 82, 82, 0.4);
      border-radius: 8px;
      color: #ff5252;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .btn-delete:hover {
      background: rgba(255, 82, 82, 0.4);
      transform: scale(1.05);
    }

    /* Chart Container */
    .chart-wrapper {
      background: rgba(255, 255, 255, 0.03);
      padding: 30px;
      border-radius: 20px;
      margin-top: 30px;
    }

    /* Alert Messages */
    .alert {
      padding: 18px 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      animation: slideIn 0.5s ease;
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 600;
    }

    .alert.error {
      background: rgba(255, 82, 82, 0.2);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.4);
    }

    .alert.success {
      background: rgba(81, 207, 102, 0.2);
      color: #51cf66;
      border: 1px solid rgba(81, 207, 102, 0.4);
    }

    .alert.warning {
      background: rgba(255, 212, 59, 0.2);
      color: #ffd43b;
      border: 1px solid rgba(255, 212, 59, 0.4);
    }

    /* Loader */
    .loader-3d {
      margin: 30px auto;
      width: 60px;
      height: 60px;
      position: relative;
    }

    .loader-3d::before,
    .loader-3d::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-3d::before {
      width: 100%;
      height: 100%;
      background: rgba(102, 126, 234, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    .loader-3d::after {
      width: 80%;
      height: 80%;
      background: rgba(118, 75, 162, 0.4);
      top: 10%;
      left: 10%;
      animation: pulse 2s ease-in-out infinite 0.3s;
    }

    /* Animations */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.5;
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 20px;
      }

      .navbar-tabs {
        flex-wrap: wrap;
        justify-content: center;
      }

      .login-box {
        padding: 35px 25px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 3D Background with Three.js
    function init3DBackground() {
      const canvas = document.getElementById('bg-canvas');
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.position.z = 5;

      // Create particles
      const geometry = new THREE.BufferGeometry();
      const vertices = [];
      const colors = [];

      for (let i = 0; i < 2000; i++) {
        vertices.push(
          (Math.random() - 0.5) * 20,
          (Math.random() - 0.5) * 20,
          (Math.random() - 0.5) * 20
        );
        
        const color = new THREE.Color();
        color.setHSL(0.6 + Math.random() * 0.2, 0.8, 0.6);
        colors.push(color.r, color.g, color.b);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.05,
        vertexColors: true,
        transparent: true,
        opacity: 0.8
      });

      const particles = new THREE.Points(geometry, material);
      scene.add(particles);

      function animate() {
        requestAnimationFrame(animate);
        particles.rotation.x += 0.0002;
        particles.rotation.y += 0.0003;
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    const API_BASE = "http://localhost:5000";

    function App() {
      const [activeTab, setActiveTab] = useState("login");
      const [user, setUser] = useState(null);
      const [message, setMessage] = useState(null);

      useEffect(() => {
        init3DBackground();
        
        // Check if user is already logged in
        fetch(`${API_BASE}/dashboard-data`, { 
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
          }
        })
          .then(res => {
            if (res.ok) {
              return res.json();
            }
            throw new Error('Not logged in');
          })
          .then(() => {
            // User is logged in, stay on login page but they can navigate
            console.log("Session active");
          })
          .catch(() => {
            console.log("No active session");
          });
      }, []);

      const showMessage = (text, type = "error") => {
        setMessage({ text, type });
        setTimeout(() => setMessage(null), 5000);
      };

      return (
        <div className="content-wrapper">
          {!user ? (
            <LoginPage setUser={setUser} showMessage={showMessage} />
          ) : (
            <>
              <div className="app-container">
                <nav className="navbar">
                  <div className="navbar-brand">
                    <div className="logo">🏥</div>
                    <h2>Healthcare AI</h2>
                  </div>
                  
                  <div className="navbar-tabs">
                    <button 
                      className={`nav-tab ${activeTab === "predict" ? "active" : ""}`}
                      onClick={() => setActiveTab("predict")}
                    >
                      🔮 Predict
                    </button>
                    <button 
                      className={`nav-tab ${activeTab === "dashboard" ? "active" : ""}`}
                      onClick={() => setActiveTab("dashboard")}
                    >
                      📊 Dashboard
                    </button>
                    <button 
                      className={`nav-tab ${activeTab === "history" ? "active" : ""}`}
                      onClick={() => setActiveTab("history")}
                    >
                      📜 History
                    </button>
                    {user.role === "admin" && (
                      <button 
                        className={`nav-tab ${activeTab === "users" ? "active" : ""}`}
                        onClick={() => setActiveTab("users")}
                      >
                        👥 Users
                      </button>
                    )}
                  </div>

                  <div className="user-info">
                    <div className="user-badge">{user.role}</div>
                    <button className="btn-logout" onClick={() => {
                      fetch(`${API_BASE}/logout`, { credentials: 'include' })
                        .then(() => {
                          setUser(null);
                          setActiveTab("login");
                          showMessage("Logged out successfully", "success");
                        });
                    }}>
                      Logout
                    </button>
                  </div>
                </nav>

                {message && (
                  <div className={`alert ${message.type}`}>
                    <span style={{fontSize: '1.5rem'}}>
                      {message.type === 'error' ? '⚠️' : message.type === 'success' ? '✅' : 'ℹ️'}
                    </span>
                    {message.text}
                  </div>
                )}

                {activeTab === "predict" && <PredictPage showMessage={showMessage} />}
                {activeTab === "dashboard" && <Dashboard user={user} />}
                {activeTab === "history" && <History />}
                {activeTab === "users" && user.role === "admin" && <UserManagement showMessage={showMessage} />}
              </div>
            </>
          )}
        </div>
      );
    }

    function LoginPage({ setUser, showMessage }) {
      const [isLogin, setIsLogin] = useState(true);
      const [formData, setFormData] = useState({
        username: "",
        password: "",
        role: "user"
      });
      const [loading, setLoading] = useState(false);

      const handleSubmit = () => {
        if (!formData.username || !formData.password) {
          showMessage("Please fill all fields");
          return;
        }

        setLoading(true);
        const endpoint = isLogin ? "/login" : "/register";
        const body = isLogin 
          ? { username: formData.username, password: formData.password }
          : formData;

        fetch(`${API_BASE}${endpoint}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(body)
        })
        .then(res => res.json())
        .then(data => {
          if (isLogin && data.message === "Login successful") {
            setUser({ username: formData.username, role: data.role });
            showMessage("Welcome back! 🎉", "success");
          } else if (!isLogin && data.message === "User registered successfully") {
            showMessage("Registration successful! Please login.", "success");
            setIsLogin(true);
          } else {
            showMessage(data.message);
          }
        })
        .catch(() => showMessage("Connection error. Is the backend running?"))
        .finally(() => setLoading(false));
      };

      return (
        <div className="login-container">
          <div className="login-box">
            <div className="login-header">
              <div className="logo">🏥</div>
              <h1>{isLogin ? "Welcome Back" : "Create Account"}</h1>
              <p>{isLogin ? "Login to access Healthcare AI" : "Join Healthcare AI Platform"}</p>
            </div>

            <div className="input-group">
              <label>Username</label>
              <div className="input-wrapper">
                <span className="input-icon">👤</span>
                <input
                  type="text"
                  value={formData.username}
                  onChange={(e) => setFormData({...formData, username: e.target.value})}
                  placeholder="Enter your username"
                  onKeyPress={(e) => e.key === 'Enter' && handleSubmit()}
                />
              </div>
            </div>

            <div className="input-group">
              <label>Password</label>
              <div className="input-wrapper">
                <span className="input-icon">🔒</span>
                <input
                  type="password"
                  value={formData.password}
                  onChange={(e) => setFormData({...formData, password: e.target.value})}
                  placeholder="Enter your password"
                  onKeyPress={(e) => e.key === 'Enter' && handleSubmit()}
                />
              </div>
            </div>

            {!isLogin && (
              <div className="input-group">
                <label>Role</label>
                <div className="input-wrapper">
                  <span className="input-icon">🎭</span>
                  <select 
                    value={formData.role}
                    onChange={(e) => setFormData({...formData, role: e.target.value})}
                  >
                    <option value="user">User</option>
                    <option value="doctor">Doctor</option>
                    <option value="admin">Admin</option>
                  </select>
                </div>
              </div>
            )}

            <button className="btn" onClick={handleSubmit} disabled={loading}>
              {loading ? "Please wait..." : (isLogin ? "Login" : "Register")}
            </button>

            <div className="toggle-form">
              {isLogin ? "Don't have an account? " : "Already have an account? "}
              <a href="#" onClick={(e) => { e.preventDefault(); setIsLogin(!isLogin); }}>
                {isLogin ? "Register here" : "Login here"}
              </a>
            </div>
          </div>
        </div>
      );
    }

    function PredictPage({ showMessage }) {
      const [formData, setFormData] = useState({
        time_in_hospital: "",
        num_lab_procedures: "",
        num_medications: "",
        number_inpatient: ""
      });
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [confidence, setConfidence] = useState(0);

      const handlePredict = () => {
        const { time_in_hospital, num_lab_procedures, num_medications, number_inpatient } = formData;

        if (!time_in_hospital || !num_lab_procedures || !num_medications || !number_inpatient) {
          showMessage("⚠️ Please fill all fields to get accurate prediction");
          return;
        }

        // Basic validation
        if (time_in_hospital < 0 || num_lab_procedures < 0 || num_medications < 0 || number_inpatient < 0) {
          showMessage("⚠️ Values cannot be negative");
          return;
        }

        setLoading(true);
        setResult(null);

        fetch(`${API_BASE}/predict`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            time_in_hospital: Number(time_in_hospital),
            num_lab_procedures: Number(num_lab_procedures),
            num_medications: Number(num_medications),
            number_inpatient: Number(number_inpatient)
          })
        })
        .then(res => {
          if (!res.ok) {
            throw new Error('Unauthorized - Please login again');
          }
          return res.json();
        })
        .then(data => {
          if (data.error) {
            showMessage(data.error);
          } else {
            setResult(data.prediction);
            // Calculate confidence based on input factors
            const riskScore = (
              (Number(time_in_hospital) * 10) +
              (Number(num_lab_procedures) * 2) +
              (Number(num_medications) * 3) +
              (Number(number_inpatient) * 15)
            ) / 4;
            setConfidence(data.prediction === "High Risk" ? Math.min(75 + (riskScore / 10), 95) : Math.max(25 - (riskScore / 10), 5));
          }
        })
        .catch((error) => {
          showMessage(error.message || "Connection error - Make sure you're logged in");
        })
        .finally(() => setLoading(false));
      };

      const resetForm = () => {
        setFormData({
          time_in_hospital: "",
          num_lab_procedures: "",
          num_medications: "",
          number_inpatient: ""
        });
        setResult(null);
        setConfidence(0);
      };

      const fillSampleData = (riskLevel) => {
        if (riskLevel === 'high') {
          setFormData({
            time_in_hospital: "12",
            num_lab_procedures: "75",
            num_medications: "25",
            number_inpatient: "3"
          });
        } else {
          setFormData({
            time_in_hospital: "2",
            num_lab_procedures: "15",
            num_medications: "5",
            number_inpatient: "0"
          });
        }
      };

      return (
        <div className="card">
          <h2>🔮 AI Readmission Risk Prediction</h2>
          <p style={{ color: 'rgba(255,255,255,0.7)', marginBottom: '30px' }}>
            Enter patient information to predict hospital readmission risk using our AI model
          </p>
          
          <div style={{ display: 'flex', gap: '10px', marginBottom: '25px' }}>
            <button 
              onClick={() => fillSampleData('high')}
              style={{ 
                padding: '10px 20px',
                background: 'rgba(255, 107, 107, 0.2)',
                border: '1px solid rgba(255, 107, 107, 0.4)',
                borderRadius: '10px',
                color: '#ff6b6b',
                cursor: 'pointer',
                fontWeight: '600',
                fontSize: '0.9rem'
              }}
            >
              📊 Sample High Risk
            </button>
            <button 
              onClick={() => fillSampleData('low')}
              style={{ 
                padding: '10px 20px',
                background: 'rgba(81, 207, 102, 0.2)',
                border: '1px solid rgba(81, 207, 102, 0.4)',
                borderRadius: '10px',
                color: '#51cf66',
                cursor: 'pointer',
                fontWeight: '600',
                fontSize: '0.9rem'
              }}
            >
              📊 Sample Low Risk
            </button>
          </div>
          
          <div className="form-grid">
            <div className="input-group">
              <label>⏱️ Time in Hospital (days)</label>
              <input
                type="number"
                value={formData.time_in_hospital}
                onChange={(e) => setFormData({...formData, time_in_hospital: e.target.value})}
                placeholder="e.g., 5"
                min="0"
                max="30"
              />
              <small style={{ color: 'rgba(255,255,255,0.5)', fontSize: '0.85rem', marginTop: '5px' }}>
                Typical range: 1-14 days
              </small>
            </div>

            <div className="input-group">
              <label>🧪 Number of Lab Procedures</label>
              <input
                type="number"
                value={formData.num_lab_procedures}
                onChange={(e) => setFormData({...formData, num_lab_procedures: e.target.value})}
                placeholder="e.g., 15"
                min="0"
                max="200"
              />
              <small style={{ color: 'rgba(255,255,255,0.5)', fontSize: '0.85rem', marginTop: '5px' }}>
                Typical range: 10-100 procedures
              </small>
            </div>

            <div className="input-group">
              <label>💊 Number of Medications</label>
              <input
                type="number"
                value={formData.num_medications}
                onChange={(e) => setFormData({...formData, num_medications: e.target.value})}
                placeholder="e.g., 10"
                min="0"
                max="100"
              />
              <small style={{ color: 'rgba(255,255,255,0.5)', fontSize: '0.85rem', marginTop: '5px' }}>
                Typical range: 1-30 medications
              </small>
            </div>

            <div className="input-group">
              <label>🏥 Previous Inpatient Visits</label>
              <input
                type="number"
                value={formData.number_inpatient}
                onChange={(e) => setFormData({...formData, number_inpatient: e.target.value})}
                placeholder="e.g., 2"
                min="0"
                max="20"
              />
              <small style={{ color: 'rgba(255,255,255,0.5)', fontSize: '0.85rem', marginTop: '5px' }}>
                Past year inpatient visits
              </small>
            </div>
          </div>

          <div style={{ display: 'flex', gap: '15px' }}>
            <button 
              className="btn" 
              onClick={handlePredict} 
              disabled={loading}
              style={{ flex: 1, background: 'linear-gradient(135deg, #51cf66 0%, #37b24d 100%)' }}
            >
              {loading ? "🔄 Analyzing Patient Data..." : "🚀 Predict Readmission Risk"}
            </button>
            <button 
              className="btn" 
              onClick={resetForm}
              style={{ flex: 1, background: 'rgba(255, 255, 255, 0.1)' }}
            >
              🔄 Clear Form
            </button>
          </div>

          {loading && (
            <div style={{ textAlign: 'center', marginTop: '30px' }}>
              <div className="loader-3d"></div>
              <p style={{ color: 'rgba(255,255,255,0.7)', marginTop: '15px' }}>
                Analyzing patient data with AI...
              </p>
            </div>
          )}

          {result && (
            <div className={`result-3d ${result === "High Risk" ? "high-risk" : "low-risk"}`}>
              <div className="result-content">
                <div className="result-icon">
                  {result === "High Risk" ? "⚠️" : "✅"}
                </div>
                <h3>{result === "High Risk" ? "High Risk Detected" : "Low Risk - All Clear"}</h3>
                <div className="result-percentage">
                  {Math.round(confidence)}%
                </div>
                <p style={{ fontSize: '1rem', opacity: 0.9, marginBottom: '15px' }}>
                  Readmission Probability
                </p>
                <div className="progress-3d">
                  <div 
                    className="progress-fill-3d" 
                    style={{ width: `${confidence}%` }}
                  ></div>
                </div>
                
                <div style={{ 
                  marginTop: '25px', 
                  padding: '20px', 
                  background: 'rgba(0,0,0,0.2)', 
                  borderRadius: '15px',
                  textAlign: 'left'
                }}>
                  <h4 style={{ marginBottom: '15px', fontSize: '1.2rem' }}>
                    {result === "High Risk" ? "⚠️ Recommendations:" : "✅ Recommendations:"}
                  </h4>
                  {result === "High Risk" ? (
                    <ul style={{ paddingLeft: '20px', lineHeight: '1.8' }}>
                      <li>Implement intensive follow-up care protocol</li>
                      <li>Schedule early post-discharge appointment (within 7 days)</li>
                      <li>Consider home health services</li>
                      <li>Review medication adherence plan</li>
                      <li>Monitor for warning signs closely</li>
                    </ul>
                  ) : (
                    <ul style={{ paddingLeft: '20px', lineHeight: '1.8' }}>
                      <li>Standard post-discharge care protocol</li>
                      <li>Routine follow-up within 2-4 weeks</li>
                      <li>Provide standard discharge education</li>
                      <li>Regular medication review</li>
                      <li>Encourage healthy lifestyle habits</li>
                    </ul>
                  )}
                </div>

                <div style={{ 
                  marginTop: '20px', 
                  padding: '15px', 
                  background: 'rgba(0,0,0,0.2)', 
                  borderRadius: '10px',
                  fontSize: '0.9rem',
                  opacity: 0.9
                }}>
                  <strong>📊 Risk Factors Considered:</strong><br/>
                  Hospital Stay: {formData.time_in_hospital} days | 
                  Lab Tests: {formData.num_lab_procedures} | 
                  Medications: {formData.num_medications} | 
                  Previous Visits: {formData.number_inpatient}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function Dashboard({ user }) {
      const [stats, setStats] = useState(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        fetch(`${API_BASE}/dashboard-data`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            setStats(data);
            
            if (chartRef.current) {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
              
              const ctx = chartRef.current.getContext('2d');
              chartInstance.current = new Chart(ctx, {
                type: 'doughnut',
                data: {
                  labels: ['High Risk', 'Low Risk'],
                  datasets: [{
                    data: [data.high, data.low],
                    backgroundColor: ['#ff6b6b', '#51cf66'],
                    borderWidth: 0
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: {
                      position: 'bottom',
                      labels: {
                        color: 'white',
                        font: { size: 14 }
                      }
                    }
                  }
                }
              });
            }
          })
          .catch(() => {});

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, []);

      if (!stats) return <div className="loader-3d"></div>;

      return (
        <div className="card">
          <h2>📊 Analytics Dashboard</h2>
          
          <div className="stats-grid">
            <div className="stat-card-3d">
              <div className="stat-icon">📈</div>
              <div className="stat-value">{stats.total}</div>
              <div className="stat-label">Total Predictions</div>
            </div>

            <div className="stat-card-3d">
              <div className="stat-icon">⚠️</div>
              <div className="stat-value">{stats.high}</div>
              <div className="stat-label">High Risk Cases</div>
            </div>

            <div className="stat-card-3d">
              <div className="stat-icon">✅</div>
              <div className="stat-value">{stats.low}</div>
              <div className="stat-label">Low Risk Cases</div>
            </div>

            <div className="stat-card-3d">
              <div className="stat-icon">📊</div>
              <div className="stat-value">
                {stats.total > 0 ? Math.round((stats.high / stats.total) * 100) : 0}%
              </div>
              <div className="stat-label">High Risk Rate</div>
            </div>
          </div>

          <div className="chart-wrapper">
            <h3 style={{ marginBottom: '20px', fontSize: '1.5rem' }}>Risk Distribution</h3>
            <div style={{ height: '350px', position: 'relative' }}>
              <canvas ref={chartRef}></canvas>
            </div>
          </div>
        </div>
      );
    }

    function History() {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch(`${API_BASE}/history`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            setHistory(data.history || []);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      if (loading) return <div className="loader-3d"></div>;

      return (
        <div className="card">
          <h2>📜 Prediction History</h2>
          
          {history.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '60px', color: 'rgba(255,255,255,0.6)' }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>📊</div>
              <p style={{ fontSize: '1.2rem' }}>No predictions yet. Start by making your first prediction!</p>
            </div>
          ) : (
            <div className="table-container">
              <table className="users-table">
                <thead>
                  <tr>
                    <th>Hospital Days</th>
                    <th>Lab Procedures</th>
                    <th>Medications</th>
                    <th>Inpatient Visits</th>
                    <th>Result</th>
                  </tr>
                </thead>
                <tbody>
                  {history.map((row, idx) => (
                    <tr key={idx}>
                      <td>{row.time_in_hospital}</td>
                      <td>{row.num_lab_procedures}</td>
                      <td>{row.num_medications}</td>
                      <td>{row.number_inpatient}</td>
                      <td>
                        <span className={`role-badge ${row.result === "High Risk" ? "admin" : "doctor"}`}>
                          {row.result}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    function UserManagement({ showMessage }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);

      const fetchUsers = () => {
        fetch(`${API_BASE}/users`, { credentials: 'include' })
          .then(res => res.json())
          .then(data => {
            setUsers(data.users || []);
            setLoading(false);
          })
          .catch(() => {
            showMessage("Failed to load users");
            setLoading(false);
          });
      };

      useEffect(() => {
        fetchUsers();
      }, []);

      const handleDelete = (userId, username) => {
        if (!confirm(`Are you sure you want to delete user "${username}"?`)) return;

        fetch(`${API_BASE}/delete-user/${userId}`, {
          method: 'DELETE',
          credentials: 'include'
        })
        .then(res => res.json())
        .then(data => {
          if (data.message === "User deleted successfully") {
            showMessage("User deleted successfully", "success");
            fetchUsers();
          } else {
            showMessage(data.message);
          }
        })
        .catch(() => showMessage("Failed to delete user"));
      };

      if (loading) return <div className="loader-3d"></div>;

      return (
        <div className="card">
          <h2>👥 User Management</h2>
          <p style={{ color: 'rgba(255,255,255,0.7)', marginBottom: '30px' }}>
            Manage all registered users and their access permissions
          </p>

          {users.length === 0 ? (
            <div style={{ textAlign: 'center', padding: '60px', color: 'rgba(255,255,255,0.6)' }}>
              <div style={{ fontSize: '4rem', marginBottom: '20px' }}>👥</div>
              <p style={{ fontSize: '1.2rem' }}>No users found in the system.</p>
            </div>
          ) : (
            <div className="table-container">
              <table className="users-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {users.map((user) => (
                    <tr key={user.id}>
                      <td>#{user.id}</td>
                      <td>{user.username}</td>
                      <td>
                        <span className={`role-badge ${user.role}`}>
                          {user.role}
                        </span>
                      </td>
                      <td>
                        {user.username !== 'admin' && (
                          <button
                            className="btn-delete"
                            onClick={() => handleDelete(user.id, user.username)}
                          >
                            🗑️ Delete
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
